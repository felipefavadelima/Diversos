<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Conversor A/D - Amostragem e Quantização</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
            margin: 0;
            box-sizing: border-box;
        }
        h2 { 
            margin-bottom: 5px; 
            text-align: center;
            font-size: 1.5rem;
        }
        p { 
            color: #666; 
            max-width: 700px; 
            text-align: center; 
            font-size: 0.95rem;
            margin-bottom: 20px;
        }
        
        .controls {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 800px;
            box-sizing: border-box;
        }
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            flex: 1;
            min-width: 140px;
        }
        input[type=range], select {
            width: 100%;
            padding: 5px;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            background-color: #0066cc;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
            width: 100%;
        }
        button:hover { background-color: #005bb5; }
        button.paused { background-color: #cc0000; }
        button.paused:hover { background-color: #a30000; }

        canvas {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            width: 100%;
            max-width: 800px;
            height: auto;
        }
        
        .table-container {
            width: 100%;
            max-width: 800px;
            max-height: 250px;
            overflow-y: auto;
            overflow-x: auto;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            min-width: 400px;
        }
        thead {
            background-color: #0066cc;
            color: white;
            position: sticky;
            top: 0;
        }
        th, td {
            padding: 8px;
            border-bottom: 1px solid #eee;
            font-family: monospace;
            font-size: 13px;
        }
        tbody tr:nth-child(even) { background-color: #f9f9f9; }
        
        .value-display {
            font-weight: bold;
            color: #0066cc;
        }
        .legend {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 15px;
            font-size: 14px;
            width: 100%;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .color-box {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <h2>Simulador de Conversor A/D</h2>
    <p>Onda de Entrada: Senoide de 10 Hz (0V a 5V). Ajuste os parâmetros para observar a conversão digital e a reconstrução do sinal.</p>

    <div class="controls">
        <div class="control-group">
            <label for="fsControl">Frequência (Hz): <span id="fsValue" class="value-display">100</span></label>
            <input type="range" id="fsControl" min="1" max="100" step="1" value="100">
        </div>
        <div class="control-group">
            <label for="bitSelect">Resolução:</label>
            <select id="bitSelect">
                <option value="2">2 Bits (4 Níveis)</option>
                <option value="4">4 Bits (16 Níveis)</option>
                <option value="8" selected>8 Bits (256 Níveis)</option>
            </select>
        </div>
        <div class="control-group">
            <label for="cycleSelect">Ciclos:</label>
            <select id="cycleSelect">
                <option value="2">2 Ciclos</option>
                <option value="10" selected>10 Ciclos</option>
                <option value="20">20 Ciclos</option>
            </select>
        </div>
        <div class="control-group">
            <label for="interpSelect">Interpolação:</label>
            <select id="interpSelect">
                <option value="none" selected>Desligada</option>
                <option value="linear">Linear</option>
                <option value="spline">Spline</option>
                <option value="sinc">Passa-baixas Ideal (Sinc)</option>
            </select>
        </div>
        <div class="control-group">
            <label>&nbsp;</label>
            <button id="playPauseBtn">Pausar</button>
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><div class="color-box" style="background: rgba(0, 102, 204, 0.5);"></div> Onda Analógica</div>
        <div class="legend-item"><div class="color-box" style="background: #cc0000; border-radius: 50%;"></div> Valor Convertido</div>
        <div class="legend-item"><div class="color-box" style="background: #ff9900;"></div> Sinal Reconstruído</div>
    </div>

    <canvas id="adcCanvas" width="800" height="300"></canvas>
    
    <div class="table-container">
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Tempo (ms)</th>
                    <th>Analógico (V)</th>
                    <th>Quantizado (V)</th>
                    <th>Decimal</th>
                    <th>Binário</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
        </table>
    </div>

    <script>
        const fsControl = document.getElementById('fsControl');
        const fsValue = document.getElementById('fsValue');
        const bitSelect = document.getElementById('bitSelect');
        const cycleSelect = document.getElementById('cycleSelect');
        const interpSelect = document.getElementById('interpSelect');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const canvas = document.getElementById('adcCanvas');
        const ctx = canvas.getContext('2d');
        const tbody = document.querySelector('#dataTable tbody');

        const FREQ_SIGNAL = 10; 
        const V_REF = 5.0; 
        
        let windowTime = 10 / FREQ_SIGNAL; 

        let animationTime = 0;
        let lastSampleIndex = -1;
        let samplesData = []; 
        let isPlaying = true;

        fsControl.addEventListener('input', () => {
            fsValue.textContent = fsControl.value;
        });

        playPauseBtn.addEventListener('click', () => {
            isPlaying = !isPlaying;
            if (isPlaying) {
                playPauseBtn.textContent = "Pausar";
                playPauseBtn.classList.remove('paused');
            } else {
                playPauseBtn.textContent = "Continuar";
                playPauseBtn.classList.add('paused');
            }
        });

        interpSelect.addEventListener('change', () => {
            if (!isPlaying) drawGraph(); 
        });

        function resetSimulation() {
            animationTime = 0;
            lastSampleIndex = -1;
            samplesData = [];
            tbody.innerHTML = ''; 
            
            const ciclos = parseInt(cycleSelect.value);
            windowTime = ciclos / FREQ_SIGNAL; 

            if (!isPlaying) {
                drawGraph(); 
            }
        }
        
        fsControl.addEventListener('change', resetSimulation);
        bitSelect.addEventListener('change', resetSimulation);
        cycleSelect.addEventListener('change', resetSimulation);

        function sincNormalized(x) {
            // sinc normalizada: sinc(x) = sin(pi*x)/(pi*x)
            if (Math.abs(x) < 1e-12) return 1;
            return Math.sin(Math.PI * x) / (Math.PI * x);
        }

        function getCompleteSampleSet(fs, bits) {
            // Gera toda a janela de amostras de forma determinística.
            // Isso evita que a reconstrução sinc dependa da velocidade da animação.
            const maxDigital = (1 << bits) - 1;
            const Ts = 1 / fs;
            const count = Math.floor(windowTime * fs + 1e-9);
            const data = [];

            for (let n = 0; n <= count; n++) {
                const t = n * Ts;
                if (t > windowTime + 1e-12) break;
                const v = 2.5 + 2.5 * Math.sin(2 * Math.PI * FREQ_SIGNAL * t);
                const digitalValue = Math.max(0, Math.min(maxDigital,
                    Math.round((v / V_REF) * maxDigital)));
                const quantizedVoltage = (digitalValue / maxDigital) * V_REF;
                data.push({ t, v, vq: quantizedVoltage, d: digitalValue });
            }
            return data;
        }

        function buildPeriodicSpectrum(baseSamples) {
            // Interpolação ideal em uma janela periódica: a soma infinita de sincs
            // periódicas é equivalente à série de Fourier discreta das amostras.
            // O ponto final t = T não é incluído, pois é equivalente a t = 0.
            const periodicSamples = baseSamples.filter(
                sample => sample.t < windowTime - 1e-12
            );
            const N = periodicSamples.length;
            const spectrum = [];

            if (N === 0) return { N: 0, spectrum: [] };

            for (let k = 0; k < N; k++) {
                let re = 0;
                let im = 0;
                for (let n = 0; n < N; n++) {
                    const angle = -2 * Math.PI * k * n / N;
                    const value = periodicSamples[n].vq;
                    re += value * Math.cos(angle);
                    im += value * Math.sin(angle);
                }
                spectrum.push({ re: re / N, im: im / N });
            }

            return { N, spectrum };
        }

        function reconstructPeriodicSinc(t, periodicModel) {
            const { N, spectrum } = periodicModel;
            if (N === 0) return 0;

            const tau = t / windowTime;
            let value = spectrum[0].re;
            const maxPositive = Math.floor((N - 1) / 2);

            // Pares de frequências positivas e negativas, combinados em forma real.
            for (let k = 1; k <= maxPositive; k++) {
                const angle = 2 * Math.PI * k * tau;
                value += 2 * (
                    spectrum[k].re * Math.cos(angle) -
                    spectrum[k].im * Math.sin(angle)
                );
            }

            // Para N par, o bin de Nyquist não possui par distinto.
            if (N % 2 === 0) {
                const kNyquist = N / 2;
                value += spectrum[kNyquist].re * Math.cos(Math.PI * N * tau);
            }

            return value;
        }

        function drawGraph() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            const padding = 40;
            const plotW = canvas.width - padding * 2;
            const plotH = canvas.height - padding * 2;
            const bits = parseInt(bitSelect.value);
            const maxDigital = (1 << bits) - 1; 
            const fs = parseInt(fsControl.value);
            const completeSamples = getCompleteSampleSet(fs, bits);
            const periodicSincModel = buildPeriodicSpectrum(completeSamples);

            const getX = (t) => padding + (t / windowTime) * plotW;
            const getY = (v) => padding + plotH - (v / V_REF) * plotH;

            // 1. Eixos e Grid
            ctx.strokeStyle = '#eee';
            ctx.lineWidth = 1;
            
            const levelsToDraw = bits <= 4 ? maxDigital : 16; 
            for(let i = 0; i <= levelsToDraw; i++) {
                let v = (i / levelsToDraw) * V_REF;
                ctx.beginPath();
                ctx.moveTo(padding, getY(v));
                ctx.lineTo(padding + plotW, getY(v));
                ctx.stroke();
            }

            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.strokeRect(padding, padding, plotW, plotH);
            
            ctx.fillStyle = '#333';
            ctx.font = '12px Arial';
            ctx.textAlign = 'right';
            ctx.fillText("5V", padding - 5, padding + 5);
            ctx.fillText("0V", padding - 5, padding + plotH + 5);
            ctx.textAlign = 'center';
            ctx.fillText("0 ms", padding, padding + plotH + 20);
            
            const endMs = (windowTime * 1000).toFixed(0);
            ctx.fillText(endMs + " ms", padding + plotW, padding + plotH + 20);

            // 2. Onda Analógica Original
            ctx.beginPath();
            for(let i = 0; i <= plotW; i++) {
                let t = (i / plotW) * windowTime;
                let v = 2.5 + 2.5 * Math.sin(2 * Math.PI * FREQ_SIGNAL * t);
                if (i === 0) ctx.moveTo(getX(t), getY(v));
                else ctx.lineTo(getX(t), getY(v));
            }
            ctx.strokeStyle = 'rgba(0, 102, 204, 0.5)'; 
            ctx.lineWidth = 3;
            ctx.stroke();

            // 3. Interpolação de Reconstrução
            const interpType = interpSelect.value;

            if (interpType === 'linear' && samplesData.length > 1) {
                ctx.beginPath();
                ctx.strokeStyle = '#ff9900';
                ctx.lineWidth = 2;
                ctx.moveTo(getX(samplesData[0].t), getY(samplesData[0].vq));
                for(let i = 1; i < samplesData.length; i++) {
                    ctx.lineTo(getX(samplesData[i].t), getY(samplesData[i].vq));
                }
                ctx.stroke();
            } 
            else if (interpType === 'spline' && samplesData.length > 1) {
                ctx.beginPath();
                ctx.strokeStyle = '#ff9900';
                ctx.lineWidth = 2;
                
                const points = samplesData.map(s => ({ x: getX(s.t), y: getY(s.vq) }));
                ctx.moveTo(points[0].x, points[0].y);
                
                const tension = 0.5;
                
                for (let i = 0; i < points.length - 1; i++) {
                    let p0 = i > 0 ? points[i - 1] : points[0];
                    let p1 = points[i];
                    let p2 = points[i + 1];
                    let p3 = i != points.length - 2 ? points[i + 2] : p2;

                    let cp1x = p1.x + (p2.x - p0.x) / 6 * tension;
                    let cp1y = p1.y + (p2.y - p0.y) / 6 * tension;
                    let cp2x = p2.x - (p3.x - p1.x) / 6 * tension;
                    let cp2y = p2.y - (p3.y - p1.y) / 6 * tension;

                    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, p2.x, p2.y);
                }
                ctx.stroke();
            }
            else if (interpType === 'sinc' && completeSamples.length > 0) {
                ctx.beginPath();
                ctx.strokeStyle = '#ff9900';
                ctx.lineWidth = 2;

                const visibleUntil = isPlaying ? animationTime : windowTime;
                let started = false;

                for (let i = 0; i <= plotW; i++) {
                    const tPixel = (i / plotW) * windowTime;
                    if (tPixel > visibleUntil + 1e-12) break;

                    const vRecon = reconstructPeriodicSinc(tPixel, periodicSincModel);
                    const x = getX(tPixel);
                    const y = getY(vRecon);

                    if (!started) {
                        ctx.moveTo(x, y);
                        started = true;
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                if (started) ctx.stroke();
            }

            // 4. Pontos Amostrados (Quantizados)
            if (samplesData.length > 0) {
                for(let s of samplesData) {
                    ctx.beginPath();
                    ctx.arc(getX(s.t), getY(s.vq), 4, 0, 2 * Math.PI);
                    ctx.fillStyle = '#cc0000';
                    ctx.fill();
                }
            }

            // 5. Linha de Varredura (Tempo atual)
            ctx.beginPath();
            ctx.moveTo(getX(animationTime), padding);
            ctx.lineTo(getX(animationTime), padding + plotH);
            ctx.strokeStyle = '#00aa00';
            ctx.lineWidth = 2;
            ctx.stroke();
        }

        function addTableRow(t, v, vq, dec, bits) {
            const tr = document.createElement('tr');
            const binString = dec.toString(2).padStart(bits, '0');
            
            tr.innerHTML = `
                <td>${(t * 1000).toFixed(1)}</td>
                <td>${v.toFixed(3)}</td>
                <td style="color: #cc0000; font-weight: bold;">${vq.toFixed(3)}</td>
                <td>${dec}</td>
                <td>${binString}</td>
            `;
            
            tbody.insertBefore(tr, tbody.firstChild);
        }

        function update() {
            if (isPlaying) {
                const step = windowTime / 300; 
                animationTime += step; 
                
                if (animationTime >= windowTime) {
                    resetSimulation();
                }

                const fs = parseInt(fsControl.value);
                const bits = parseInt(bitSelect.value);
                const maxDigital = (1 << bits) - 1; 
                const Ts = 1 / fs;

                const currentSampleIndex = Math.floor((animationTime + 1e-12) / Ts);

                // Adiciona todas as amostras atravessadas pelo passo de animação.
                // O código anterior adicionava apenas a última e podia pular amostras.
                while (lastSampleIndex < currentSampleIndex) {
                    const nextSampleIndex = lastSampleIndex + 1;
                    const sampleTime = nextSampleIndex * Ts;

                    if (sampleTime <= windowTime + 1e-12) {
                        const v = 2.5 + 2.5 * Math.sin(2 * Math.PI * FREQ_SIGNAL * sampleTime);
                        const digitalValue = Math.max(0, Math.min(maxDigital,
                            Math.round((v / V_REF) * maxDigital)));
                        const quantizedVoltage = (digitalValue / maxDigital) * V_REF;

                        samplesData.push({
                            t: sampleTime,
                            v,
                            vq: quantizedVoltage,
                            d: digitalValue
                        });

                        addTableRow(sampleTime, v, quantizedVoltage, digitalValue, bits);
                    }

                    lastSampleIndex = nextSampleIndex;
                }

                drawGraph();
            }
            requestAnimationFrame(update);
        }

        update();
    </script>
</body>
</html>
