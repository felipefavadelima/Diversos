<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="amostragem.webmanifest">
    <title>Amostragem - Múltiplas Entradas com Voz</title>
    <style>
        :root {
            --bg: #F8F9FA;
            --surface: #FFFFFF;
            --orig-color: #FF453A; /* Vermelho Original */
            --samp-color: #007AFF; /* Azul Amostrado */
            --filt-color: #FF00FF; /* Magenta Filtrado */
            --text-main: #333333;
            --text-sec: #8E8E93;
            --grid: #F0F0F5;
            --active-glow: #34C759; /* Verde de seleção */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: system-ui, sans-serif; }

        body {
            background-color: #333; 
            display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        .stage {
            position: relative;
            width: 100vw;
            max-width: 1600px;
            aspect-ratio: 16 / 9;
        }

        /* Container Principal 16:9 */
        .container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: var(--bg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        /* Camada de Linhas e Setas SVG */
        .svg-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none;
        }
        .svg-line { stroke: #000; stroke-width: 2; fill: none; }
        .svg-arrow { fill: #000; }


        .audio-note-top {
            position: absolute; top: 4.2%; left: 6%; width: 22%;
            font-size: 12px; font-weight: 600; color: #8E8E93;
            text-align: left; z-index: 3; white-space: nowrap;
        }

        /* Controles Deslizantes */
        .controls {
            position: absolute; top: 8%; left: 4%; width: 24%; height: 35%;
            display: flex; flex-direction: column; justify-content: space-around;
            z-index: 2;
        }
        
        .slider-row { display: flex; align-items: center; gap: 15px; }
        .icon-box {
            width: 45px; height: 45px; background: #F0F0F5; border-radius: 12px;
            display: flex; justify-content: center; align-items: center; font-size: 22px;
        }
        .slider-wrap { flex: 1; display: flex; flex-direction: column; gap: 5px; }
        .slider-label { font-size: 14px; font-weight: 600; color: var(--text-sec); display: flex; justify-content: space-between; }
        .slider-val { font-weight: bold; color: var(--text-main); }
        
        input[type=range] {
            width: 100%; height: 6px; border-radius: 3px; appearance: none; background: #E5E5EA; outline: none; cursor: pointer;
        }
        input[type=range]::-webkit-slider-thumb {
            appearance: none; width: 20px; height: 20px; border-radius: 50%;
            background: #FFF; border: 2px solid #D1D1D6; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* Gráficos Compartilhados */
        .graph-container {
            position: absolute; background: var(--surface); border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); z-index: 2;
            cursor: pointer; border: 4px solid transparent; transition: all 0.2s ease;
            display: flex; flex-direction: column; overflow: hidden;
        }
        .graph-container:hover { transform: scale(1.02); }
        .graph-container.active { border-color: var(--active-glow); box-shadow: 0 8px 25px rgba(52,199,89,0.3); }
        
        /* Textos Internos dos Gráficos */
        .graph-label-type { position: absolute; top: 12px; left: 15px; font-size: 18px; font-weight: 800; z-index: 3; }
        .graph-label-desc { position: absolute; top: 35px; left: 15px; font-size: 13px; font-weight: 600; color: var(--text-sec); z-index: 3; }
        .graph-label-domain { 
            position: absolute; top: 12px; right: 15px; font-size: 12px; font-weight: 700; color: var(--text-sec); 
            background: rgba(240,240,245,0.85); padding: 4px 10px; border-radius: 8px; z-index: 3; backdrop-filter: blur(2px);
        }

        canvas { width: 100%; height: 100%; display: block; margin-top: 15px;} 

        /* Posições dos Gráficos */
        #orig-box { top: 48%; left: 4%; width: 24%; height: 45%; }
        #samp-box { top: 6%; left: 36%; width: 24%; height: 45%; }
        #filt-box { top: 6%; left: 68%; width: 24%; height: 45%; }

        /* Diagrama da Chave (Meio Inferior) */
        #switch-anim {
            position: absolute; top: 64%; left: 39%; width: 18%; height: 12%; z-index: 2;
        }

        /* Bloco do Filtro LP (Direita Inferior) */
        .lp-block {
            position: absolute; top: 58%; left: 69%; width: 18%; height: 20%;
            border: 2px solid #000; background: transparent; z-index: 2;
            overflow: hidden;
        }
        #canvas-lp {
            position: absolute; inset: 0; width: 100%; height: 100%; display: block; margin: 0;
        }
        .lp-text {
            position: absolute; right: 18%; top: 49%; transform: translateY(-50%);
            font-size: 20px; font-weight: 800; color: #000; letter-spacing: 0.5px;
            background: rgba(255,255,255,0.45); padding: 2px 4px; border-radius: 4px;
            z-index: 3;
        }

        /* Seletor de Entrada (Dropdown Moderno Centralizado embaixo) */
        #input-select-container {
            position: absolute; bottom: 8%; left: 36%; z-index: 2;
            display: flex; align-items: center; gap: 10px;
            background: #FFFFFF; padding: 6px 15px; border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 2px solid #E5E5EA;
        }
        .select-label { font-size: 15px; font-weight: 600; color: var(--text-main); }
        select {
            appearance: none; background: #F8F9FA; border: 1px solid #D1D1D6;
            color: var(--text-main); padding: 8px 12px; border-radius: 10px;
            font-size: 14px; font-weight: bold; outline: none; cursor: pointer;
        }

        /* Toggles de Domínio */
        #domain-toggle-group {
            position: absolute; bottom: 8%; right: 4%; z-index: 2; display: flex; align-items: center; gap: 15px;
        }
        .toggle-label { font-size: 16px; font-weight: 600; color: var(--text-main); }
        #audio-gain-note {
            position: absolute; top: 79.2%; left: 69%; width: 18%;
            z-index: 2; font-size: 12px; font-weight: 600; color: var(--text-sec);
            text-align: center; white-space: nowrap; opacity: 0.90;
        }

        .switch { position: relative; display: inline-block; width: 70px; height: 34px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-toggle {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #E5E5EA; transition: .4s; border-radius: 34px; border: 2px solid #D1D1D6;
        }
        .slider-toggle:before {
            position: absolute; content: ""; height: 26px; width: 26px; left: 2px; bottom: 2px;
            background-color: white; transition: .4s; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        input:checked + .slider-toggle { background-color: #E5E5EA; }
        input:checked + .slider-toggle:before { transform: translateX(36px); }


        /* Modo de navegação móvel: ativado quando não há fullscreen. */
        :root {
            --stage-base-width: 1600px;
            --stage-base-height: 900px;
            --mobile-stage-scale: 1;
            --mobile-stage-width: 100vw;
            --mobile-stage-height: calc(100vw * 9 / 16);
        }

        html.mobile-navigable {
            overflow: auto;
            overscroll-behavior: auto;
            background: #333;
        }
        body.mobile-navigable {
            display: block;
            width: 100%;
            height: auto;
            min-height: 100dvh;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: auto;
            touch-action: pan-x pan-y pinch-zoom;
            padding: max(8px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) max(8px, env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
        }
        body.mobile-navigable .stage {
            width: var(--mobile-stage-width);
            height: var(--mobile-stage-height);
            max-width: none;
            aspect-ratio: auto;
            margin: 0 auto;
            overflow: visible;
        }
        body.mobile-navigable .container {
            width: var(--stage-base-width);
            height: var(--stage-base-height);
            transform: scale(var(--mobile-stage-scale));
            transform-origin: top left;
            box-shadow: 0 6px 20px rgba(0,0,0,0.35);
        }
        body.mobile-navigable input,
        body.mobile-navigable select,
        body.mobile-navigable .graph-container {
            touch-action: manipulation;
        }
    </style>
</head>
<body>

    <div id="stage" class="stage">
    <div class="container">
        
        <!-- Linhas e Setas de Conexão -->
        <svg class="svg-layer">
            <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                    <path d="M 0 0 L 10 5 L 0 10 z" class="svg-arrow" />
                </marker>
            </defs>
            <line x1="28%" y1="70%" x2="39%" y2="70%" class="svg-line" />
            <line x1="57%" y1="70%" x2="69%" y2="70%" class="svg-line" />
            <line x1="48%" y1="63%" x2="48%" y2="52%" class="svg-line" marker-end="url(#arrow)" />
            <line x1="78%" y1="57%" x2="78%" y2="52%" class="svg-line" marker-end="url(#arrow)" />
        </svg>

        <div class="audio-note-top">Volume de áudio ajustado para audição</div>

        <!-- Controles Deslizantes -->
        <div class="controls">
            <div class="slider-row">
                <div class="icon-box">⏱️</div>
                <div class="slider-wrap">
                    <div class="slider-label"><span>Freq. Amostragem</span> <span class="slider-val" id="fs-val">3500Hz</span></div>
                    <input type="range" id="fs-slider" min="100" max="6000" value="3500" step="50">
                </div>
            </div>
            <div class="slider-row">
                <div class="icon-box">⎍</div>
                <div class="slider-wrap">
                    <div class="slider-label"><span>Duty Cycle</span> <span class="slider-val" id="duty-val">50%</span></div>
                    <input type="range" id="duty-slider" min="0.02" max="1" value="0.5" step="0.01">
                </div>
            </div>
            <div class="slider-row">
                <div class="icon-box">📉</div>
                <div class="slider-wrap">
                    <div class="slider-label"><span>Frequência de Corte</span> <span class="slider-val" id="fc-val">3600Hz</span></div>
                    <input type="range" id="fc-slider" min="50" max="6000" value="3600" step="50">
                </div>
            </div>
        </div>

        <!-- Gráficos Clicáveis -->
        <div class="graph-container" id="orig-box" onclick="selectGraph('orig')">
            <div class="graph-label-type" style="color: var(--orig-color);">Original</div>
            <div class="graph-label-desc" id="graph-desc-orig">500Hz</div>
            <div class="graph-label-domain domain-text">Tempo</div>
            <canvas id="canvas-orig"></canvas>
        </div>

        <div class="graph-container" id="samp-box" onclick="selectGraph('samp')">
            <div class="graph-label-type" style="color: var(--samp-color);">Amostrado</div>
            <div class="graph-label-domain domain-text">Tempo</div>
            <canvas id="canvas-samp"></canvas>
        </div>

        <div class="graph-container" id="filt-box" onclick="selectGraph('filt')">
            <div class="graph-label-type" style="color: var(--filt-color);">Filtrado</div>
            <div class="graph-label-domain domain-text">Tempo</div>
            <canvas id="canvas-filt"></canvas>
        </div>

        <!-- Diagramas Centrais -->
        <div id="switch-anim"><canvas id="canvas-switch"></canvas></div>

        <div class="lp-block">
            <canvas id="canvas-lp"></canvas>
            <div class="lp-text">LP</div>
        </div>

        <!-- Seletor de Tipo de Onda (Dropdown) -->
        <div id="input-select-container">
            <span class="select-label">Sinal de Entrada:</span>
            <select id="input-select">
                <option value="1">1 - 500Hz</option>
                <option value="2">2 - 300Hz + 500Hz</option>
                <option value="3">3 - Ruído filtrado</option>
                <option value="4">4 - Voz falando Olá</option>
                <option value="5">5 - Amostragem de sinais é divertido</option>
            </select>
        </div>

        <!-- Toggle Domínio -->
        <div class="toggle-group" id="domain-toggle-group">
            <span class="toggle-label">Domínio Tempo</span>
            <label class="switch">
                <input type="checkbox" id="domain-toggle">
                <span class="slider-toggle"></span>
            </label>
            <span class="toggle-label">Domínio Frequência</span>
        </div>

        <div id="audio-gain-note">Volume de áudio ajustado para audição</div>

    </div>
    </div>

<script>

    // --- TELA CHEIA NO PRIMEIRO TOQUE/CLIQUE ---
    // Chrome/Firefox Android e Safari/iPad: Fullscreen API após gesto do usuário.
    // iPhone: quando executado como Web App da Tela de Início, a UI do navegador já fica oculta.
    let fullscreenInteractionHandled = false;
    const STAGE_BASE_W = 1600;
    const STAGE_BASE_H = 900;

    function updateMobileStageGeometry() {
        if (!document.body.classList.contains('mobile-navigable')) return;
        const vw = Math.max(320, window.innerWidth || document.documentElement.clientWidth || STAGE_BASE_W);
        const vh = Math.max(320, window.innerHeight || document.documentElement.clientHeight || STAGE_BASE_H);
        const usableW = Math.max(280, vw - 16);
        const usableH = Math.max(240, vh - 16);
        const scale = Math.min(usableW / STAGE_BASE_W, usableH / STAGE_BASE_H);
        const stageW = STAGE_BASE_W * scale;
        const stageH = STAGE_BASE_H * scale;
        document.documentElement.style.setProperty('--mobile-stage-scale', String(scale));
        document.documentElement.style.setProperty('--mobile-stage-width', `${stageW}px`);
        document.documentElement.style.setProperty('--mobile-stage-height', `${stageH}px`);
    }

    function isNativeFullscreen() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement);
    }

    function isMobileLike() {
        return window.matchMedia('(max-width: 1000px)').matches ||
               window.matchMedia('(pointer: coarse)').matches ||
               ('ontouchstart' in window);
    }

    function setMobileNavigationMode(enabled) {
        if (!isMobileLike()) return;
        document.documentElement.classList.toggle('mobile-navigable', enabled);
        document.body.classList.toggle('mobile-navigable', enabled);
        if (enabled) {
            updateMobileStageGeometry();
            requestAnimationFrame(() => window.scrollTo({ left: 0, top: 0, behavior: 'auto' }));
        }
    }

    function syncMobileNavigationMode() {
        if (!isMobileLike()) return;
        if (isNativeFullscreen()) {
            setMobileNavigationMode(false);
        } else if (fullscreenInteractionHandled) {
            setMobileNavigationMode(true);
        }
    }

    async function enterFullscreenOnFirstInteraction() {
        if (fullscreenInteractionHandled) return;
        fullscreenInteractionHandled = true;

        const el = document.documentElement;
        if (isNativeFullscreen()) {
            setMobileNavigationMode(false);
            return;
        }

        let requested = false;
        try {
            if (el.requestFullscreen) {
                requested = true;
                try {
                    await el.requestFullscreen({ navigationUI: 'hide' });
                } catch (_) {
                    await el.requestFullscreen();
                }
            } else if (el.webkitRequestFullscreen) {
                requested = true;
                el.webkitRequestFullscreen();
            }
        } catch (_) {
            // A navegação móvel abaixo assume automaticamente quando o navegador negar fullscreen.
        }

        // APIs WebKit antigas podem não retornar Promise; aguarda o estado estabilizar.
        setTimeout(() => {
            if (isNativeFullscreen()) {
                setMobileNavigationMode(false);
            } else {
                setMobileNavigationMode(true);
                // Em Safari móvel, isto ainda pode recolher parcialmente a barra dinâmica.
                if (!requested) window.scrollTo(0, 1);
            }
        }, 180);
    }

    // Se o usuário sair do fullscreen, a interface passa imediatamente a ser navegável no celular.
    document.addEventListener('fullscreenchange', syncMobileNavigationMode);
    document.addEventListener('webkitfullscreenchange', syncMobileNavigationMode);
    window.addEventListener('resize', updateMobileStageGeometry);
    window.addEventListener('orientationchange', () => setTimeout(updateMobileStageGeometry, 120));

    // Cobertura ampla de gesto do usuário em navegadores móveis.
    document.addEventListener('pointerdown', enterFullscreenOnFirstInteraction, { once: true, capture: true });
    document.addEventListener('touchend', enterFullscreenOnFirstInteraction, { once: true, capture: true, passive: true });
    document.addEventListener('click', enterFullscreenOnFirstInteraction, { once: true, capture: true });

AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA";
    let voiceNativeSamples = null;       // Voz selecionada após PB ideal fixo de 2 kHz
    let voiceSourceKey = null;
    let voiceDisplayStartTime = 0;
    let voiceSampleRate = 22050;         // Toda a cadeia da voz permanece em 22,05 kHz
    const VOICE_PREFILTER_FC = 2000;
    const VOICE_REPEAT_PAUSE = 0.25; // 250 ms de silêncio entre dois 'Olás'     // Hz: pré-filtro ideal fixo da voz
    let voiceFiltered = null;
    let voiceSampled = null;
    let voiceSpectrumOrig = null;
    let voiceSpectrumSampled = null;
    let voiceSpectrumFiltered = null;
    let voiceDisplaySpectrumSampledAnalog = null;
    let voiceDisplaySpectrumFilteredAnalog = null;
    let voiceProcessKey = '';
    let voiceAudioTime = 0;

    function voiceB64ToArrayBuffer(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes.buffer;
    }

    function voiceParsePCM16Wav(buffer) {
        const dv = new DataView(buffer);
        const sr = dv.getUint32(24, true);
        const channels = dv.getUint16(22, true);
        const bits = dv.getUint16(34, true);
        if (bits !== 16) throw new Error('O áudio de voz deve ser PCM de 16 bits.');

        let p = 12, dataOffset = -1, dataSize = 0;
        while (p < dv.byteLength - 8) {
            const id = String.fromCharCode(dv.getUint8(p), dv.getUint8(p+1), dv.getUint8(p+2), dv.getUint8(p+3));
            const sz = dv.getUint32(p + 4, true);
            if (id === 'data') { dataOffset = p + 8; dataSize = sz; break; }
            p += 8 + sz + (sz & 1);
        }
        if (dataOffset < 0) throw new Error('Bloco data não encontrado no WAV.');

        const frames = Math.floor(dataSize / (2 * channels));
        const out = new Float32Array(frames);
        let off = dataOffset;
        for (let i = 0; i < frames; i++) {
            let sum = 0;
            for (let c = 0; c < channels; c++) {
                sum += dv.getInt16(off, true) / 32768;
                off += 2;
            }
            out[i] = sum / channels;
        }
        return { samples: out, sampleRate: sr };
    }

    function voiceNextPow2(n) { let p = 1; while (p < n) p <<= 1; return p; }

    function voiceFFT(re, im, inverse = false) {
        const n = re.length;
        for (let i = 1, j = 0; i < n; i++) {
            let bit = n >> 1;
            for (; j & bit; bit >>= 1) j ^= bit;
            j ^= bit;
            if (i < j) {
                [re[i], re[j]] = [re[j], re[i]];
                [im[i], im[j]] = [im[j], im[i]];
            }
        }
        for (let len = 2; len <= n; len <<= 1) {
            const ang = 2 * Math.PI / len * (inverse ? 1 : -1);
            const wlenR = Math.cos(ang), wlenI = Math.sin(ang);
            for (let i = 0; i < n; i += len) {
                let wr = 1, wi = 0;
                for (let j = 0; j < len / 2; j++) {
                    const uR = re[i+j], uI = im[i+j];
                    const vR = re[i+j+len/2] * wr - im[i+j+len/2] * wi;
                    const vI = re[i+j+len/2] * wi + im[i+j+len/2] * wr;
                    re[i+j] = uR + vR; im[i+j] = uI + vI;
                    re[i+j+len/2] = uR - vR; im[i+j+len/2] = uI - vI;
                    const nwr = wr * wlenR - wi * wlenI;
                    wi = wr * wlenI + wi * wlenR;
                    wr = nwr;
                }
            }
        }
        if (inverse) {
            for (let i = 0; i < n; i++) { re[i] /= n; im[i] /= n; }
        }
    }

    function voiceIdealLowpass(data, cutoffHz) {
        const N = voiceNextPow2(data.length);
        const re = new Float64Array(N);
        const im = new Float64Array(N);
        for (let i = 0; i < data.length; i++) re[i] = data[i];

        voiceFFT(re, im, false);
        for (let k = 0; k < N; k++) {
            const f = k <= N/2
                ? k * voiceSampleRate / N
                : (k - N) * voiceSampleRate / N;
            if (Math.abs(f) > cutoffHz) {
                re[k] = 0;
                im[k] = 0;
            }
        }
        voiceFFT(re, im, true);

        const out = new Float32Array(data.length);
        for (let i = 0; i < data.length; i++) out[i] = re[i];
        return out;
    }

    function voiceInit() {
        const requestedSource = (inputType === '5') ? 'pds' : 'ola';
        if (voiceNativeSamples && voiceSourceKey === requestedSource) return;

        const b64 = requestedSource === 'pds' ? VOICE_PDS_WAV_BASE64 : VOICE_WAV_BASE64;
        const parsed = voiceParsePCM16Wav(voiceB64ToArrayBuffer(b64));
        voiceSampleRate = parsed.sampleRate;

        // As duas vozes seguem exatamente a mesma cadeia:
        // WAV PCM16 em 22,05 kHz -> PB ideal fixo de 2 kHz -> sinal Original.
        voiceNativeSamples = voiceIdealLowpass(parsed.samples, VOICE_PREFILTER_FC);
        voiceSourceKey = requestedSource;

        // Reinicia todos os estados dependentes da voz quando a fonte muda.
        voiceSampled = null;
        voiceFiltered = null;
        voiceSpectrumOrig = null;
        voiceSpectrumSampled = null;
        voiceSpectrumFiltered = null;
        voiceDisplaySpectrumSampledAnalog = null;
        voiceDisplaySpectrumFilteredAnalog = null;
        voiceProcessKey = '';
        voiceAudioTime = 0;

        // Para o gráfico de tempo, começa próximo do primeiro trecho efetivamente sonoro.
        let peak = 0;
        for (let i = 0; i < voiceNativeSamples.length; i++) peak = Math.max(peak, Math.abs(voiceNativeSamples[i]));
        const threshold = peak * 0.06;
        let first = 0;
        while (first < voiceNativeSamples.length && Math.abs(voiceNativeSamples[first]) < threshold) first++;
        voiceDisplayStartTime = Math.max(0, first / voiceSampleRate - 0.004);
    }

    function voiceNativeValueAt(data, t) {
        if (!data || data.length === 0) return 0;
        const duration = data.length / voiceSampleRate;
        const cycleDuration = duration + VOICE_REPEAT_PAUSE;
        let tt = t % cycleDuration;
        if (tt < 0) tt += cycleDuration;

        // Pequena pausa de silêncio antes de reiniciar a fala.
        if (tt >= duration) return 0;

        const pos = tt * voiceSampleRate;
        const i0 = Math.min(data.length - 1, Math.floor(pos));
        const i1 = Math.min(data.length - 1, i0 + 1);
        const a = pos - Math.floor(pos);
        return data[i0] * (1 - a) + data[i1] * a;
    }

    function voiceComputeMagnitudeSpectrum(data) {
        const N = voiceNextPow2(data.length);
        const re = new Float64Array(N);
        const im = new Float64Array(N);
        for (let i = 0; i < data.length; i++) re[i] = data[i];
        voiceFFT(re, im, false);
        const half = N / 2;
        const mag = new Float32Array(half + 1);
        let maxMag = 1e-12;
        for (let k = 0; k <= half; k++) {
            const m = Math.hypot(re[k], im[k]);
            mag[k] = m;
            if (m > maxMag) maxMag = m;
        }
        for (let k = 0; k <= half; k++) mag[k] /= maxMag;
        return { mag, N, sampleRate: voiceSampleRate };
    }

    function voiceSpectrumValue(spec, f) {
        if (!spec) return 0;
        const af = Math.abs(f);
        if (typeof spec.maxFreq === 'number') {
            if (af > spec.maxFreq) return 0;
            const pos = (af / spec.maxFreq) * (spec.mag.length - 1);
            const k0 = Math.floor(pos);
            const k1 = Math.min(spec.mag.length - 1, k0 + 1);
            const a = pos - k0;
            return spec.mag[k0] * (1 - a) + spec.mag[k1] * a;
        }
        const maxF = spec.sampleRate / 2;
        if (af > maxF) return 0;
        const pos = af * spec.N / spec.sampleRate;
        const k0 = Math.floor(pos);
        const k1 = Math.min(spec.mag.length - 1, k0 + 1);
        const a = pos - k0;
        return spec.mag[k0] * (1 - a) + spec.mag[k1] * a;
    }

    function voiceBuildAnalogDisplaySpectra() {
        const maxDisplayFreq = 6000;
        const bins = 2048;
        const sampMag = new Float32Array(bins + 1);
        const filtMag = new Float32Array(bins + 1);

        for (let i = 0; i <= bins; i++) {
            const f = (i / bins) * maxDisplayFreq;
            let amp = 0;

            // Representação analógica ideal do chaveamento. O espectro Original
            // já usa sua maior componente como referência unitária. Amostrado e
            // Filtrado permanecem nessa MESMA escala, sem normalização própria.
            if (duty >= 0.999999) {
                amp = voiceSpectrumValue(voiceSpectrumOrig, f);
            } else {
                const voiceBandwidth = VOICE_PREFILTER_FC;
                const nMax = Math.ceil((maxDisplayFreq + voiceBandwidth) / Math.max(fs, 1)) + 1;
                for (let n = -nMax; n <= nMax; n++) {
                    const coef = (n === 0) ? duty : Math.sin(Math.PI * n * duty) / (Math.PI * n);
                    amp += Math.abs(coef) * voiceSpectrumValue(voiceSpectrumOrig, f - n * fs);
                }
            }

            sampMag[i] = amp;
            filtMag[i] = (f <= fc) ? amp : 0;
        }

        voiceDisplaySpectrumSampledAnalog = { mag: sampMag, maxFreq: maxDisplayFreq };
        voiceDisplaySpectrumFilteredAnalog = { mag: filtMag, maxFreq: maxDisplayFreq };
    }

    function voiceEnsureFiltered() {
        voiceInit();
        const key = `${fs}|${duty}|${fc}`;
        if (voiceFiltered && voiceProcessKey === key) return;

        // Toda a cadeia abaixo é calculada na grade nativa de 22,05 kHz.
        // O slider fs NÃO altera a taxa numérica do vetor: ele define somente
        // a frequência de repetição do trem de pulsos 0/1 da chave.
        voiceSampled = new Float32Array(voiceNativeSamples.length);
        for (let i = 0; i < voiceNativeSamples.length; i++) {
            const t = i / voiceSampleRate;
            const phase = ((t * fs) % 1.0 + 1.0) % 1.0;
            const gate = (phase <= duty / 2.0 || phase >= 1.0 - duty / 2.0) ? 1.0 : 0.0;
            voiceSampled[i] = voiceNativeSamples[i] * gate;
        }

        // Espectros das formas de onda realmente usadas, todos referenciados a 22,05 kHz.
        voiceSpectrumOrig = voiceComputeMagnitudeSpectrum(voiceNativeSamples);
        voiceSpectrumSampled = voiceComputeMagnitudeSpectrum(voiceSampled);
        voiceBuildAnalogDisplaySpectra();

        // PB ideal ajustável aplicado ao sinal após a chave, mas sem o artefato
        // de quantizar pulsos muito estreitos diretamente na grade de 22,05 kHz.
        //
        // Para a saída filtrada usamos a série de Fourier do trem de pulsos
        // analógico: p(t)=D+2*sum c_n cos(2*pi*n*fs*t),
        // c_n=sin(pi*n*D)/(pi*n). Só são necessários os harmônicos capazes de
        // transladar a voz (limitada a 2 kHz) para dentro da banda |f|<=Fc.
        // Assim, dentro da banda do filtro, o resultado é equivalente ao modelo
        // analógico ideal e não sofre aliasing numérico da própria chave.
        const N = voiceNextPow2(voiceSampled.length);
        const pBand = new Float64Array(voiceSampled.length);
        pBand.fill(duty);

        if (duty < 0.999999) {
            const nMaxRelevant = Math.max(0, Math.floor((fc + VOICE_PREFILTER_FC) / Math.max(fs, 1)));
            for (let n = 1; n <= nMaxRelevant; n++) {
                const coef2 = 2.0 * Math.sin(Math.PI * n * duty) / (Math.PI * n);
                if (Math.abs(coef2) < 1e-14) continue;

                const omega = 2.0 * Math.PI * n * fs / voiceSampleRate;
                const cStep = Math.cos(omega);
                const sStep = Math.sin(omega);
                let c = 1.0, sn = 0.0;

                for (let i = 0; i < pBand.length; i++) {
                    pBand[i] += coef2 * c;
                    const nc = c * cStep - sn * sStep;
                    sn = sn * cStep + c * sStep;
                    c = nc;

                    // Evita acúmulo numérico perceptível em áudios longos.
                    if ((i & 4095) === 4095) {
                        const r = Math.hypot(c, sn) || 1.0;
                        c /= r; sn /= r;
                    }
                }
            }
        }

        const re = new Float64Array(N);
        const im = new Float64Array(N);
        for (let i = 0; i < voiceNativeSamples.length; i++) {
            re[i] = voiceNativeSamples[i] * pBand[i];
        }
        voiceFFT(re, im, false);

        for (let k = 0; k < N; k++) {
            const f = k <= N/2
                ? k * voiceSampleRate / N
                : (k - N) * voiceSampleRate / N;
            if (Math.abs(f) > fc) {
                re[k] = 0;
                im[k] = 0;
            }
        }

        const half = N / 2;
        const mag = new Float32Array(half + 1);
        let maxMag = 1e-12;
        for (let k = 0; k <= half; k++) {
            const m = Math.hypot(re[k], im[k]);
            mag[k] = m;
            if (m > maxMag) maxMag = m;
        }
        for (let k = 0; k <= half; k++) mag[k] /= maxMag;
        voiceSpectrumFiltered = { mag, N, sampleRate: voiceSampleRate };

        voiceFFT(re, im, true);
        voiceFiltered = new Float32Array(voiceSampled.length);
        let peak = 0;
        for (let i = 0; i < voiceFiltered.length; i++) {
            voiceFiltered[i] = re[i];
            peak = Math.max(peak, Math.abs(voiceFiltered[i]));
        }

        // Mantém apenas proteção contra clipping já existente no simulador.
        if (peak > 0.98) {
            const g = 0.98 / peak;
            for (let i = 0; i < voiceFiltered.length; i++) voiceFiltered[i] *= g;
        }
        voiceProcessKey = key;
    }


    // Parâmetros Globais
    let fs = 3500;
    let duty = 0.5;
    let fc = 3600;
    
    let viewDomain = 'time'; // 'time' ou 'freq'
    let inputType = '1'; // '1', '2', '3', '4', '5'
    let activeSource = null; 
    const isVoiceInput = () => inputType === '4' || inputType === '5';
    
    // Configuração do Ruído (Opção 3: decaimento linear de 0 a 500Hz)
    const noiseComps = [];
    for(let f = 10; f < 500; f += 10) {
        let gain = 1.0 - (f / 500.0);
        noiseComps.push({ f: f, A: gain * 0.2, phi: Math.random() * 2 * Math.PI });
    }

    // Áudio
    let audioCtx, scriptNode;
    let audioTime = 0;
    let gainOrig, gainSamp, gainFilt;
    let isStarted = false;

    // Elementos DOM
    const fsSlider = document.getElementById('fs-slider');
    const dutySlider = document.getElementById('duty-slider');
    const fcSlider = document.getElementById('fc-slider');
    const domainToggle = document.getElementById('domain-toggle');
    const inputSelect = document.getElementById('input-select');

    const updateLabel = (id, val, suffix) => document.getElementById(id).innerText = `${val}${suffix}`;

    fsSlider.oninput = (e) => { fs = parseFloat(e.target.value); updateLabel('fs-val', fs, 'Hz'); drawAll(); };
    dutySlider.oninput = (e) => { duty = parseFloat(e.target.value); updateLabel('duty-val', Math.round(duty*100), '%'); drawAll(); };
    fcSlider.oninput = (e) => { fc = parseFloat(e.target.value); updateLabel('fc-val', fc, 'Hz'); drawAll(); };
    
    domainToggle.onchange = (e) => {
        viewDomain = e.target.checked ? 'freq' : 'time';
        const domainStr = viewDomain === 'time' ? 'Tempo' : 'Módulo do espectro';
        document.querySelectorAll('.domain-text').forEach(el => el.innerText = domainStr);
        drawAll();
    };

    inputSelect.onchange = (e) => {
        inputType = e.target.value;
        const descriptions = {
            '1': '500Hz',
            '2': '300Hz + 500Hz',
            '3': 'Ruído filtrado',
            '4': 'Voz (Olá)',
            '5': 'Voz (Amostragem de sinais é divertido)'
        };
        document.getElementById('graph-desc-orig').innerText = descriptions[inputType];
        if (isVoiceInput()) voiceInit();
        drawAll();
    };

    // --- SELEÇÃO E ÁUDIO ---
    function unlockAudio() {
        if (!isStarted) {
            initAudio();
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            isStarted = true;
        }
    }
    document.body.addEventListener('pointerdown', unlockAudio, { once: true });
    document.body.addEventListener('touchstart', unlockAudio, { once: true });

    function selectGraph(type) {
        if (!isStarted) unlockAudio();

        const clickedActiveGraph = (activeSource === type);

        document.getElementById('orig-box').classList.remove('active');
        document.getElementById('samp-box').classList.remove('active');
        document.getElementById('filt-box').classList.remove('active');

        // Segundo toque/clique no gráfico que já está tocando: desliga o áudio.
        if (clickedActiveGraph) {
            activeSource = null;
            updateAudioGains();
            return;
        }

        activeSource = type;
        document.getElementById(`${type}-box`).classList.add('active');

        if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        updateAudioGains();
    }

    function updateAudioGains() {
        if(!audioCtx) return;
        let t = audioCtx.currentTime;
        
        gainOrig.gain.setTargetAtTime(activeSource === 'orig' ? 1 : 0, t, 0.05);
        gainSamp.gain.setTargetAtTime(activeSource === 'samp' ? 1 : 0, t, 0.05);
        
        let compGain = (1.0 / duty);
        gainFilt.gain.setTargetAtTime(activeSource === 'filt' ? compGain : 0, t, 0.05);
    }

    // --- MATEMÁTICA DAS ENTRADAS ---
    function getOriginalSignal(t) {
        if (inputType === '1') {
            return Math.sin(2 * Math.PI * 500 * t);
        } else if (inputType === '2') {
            let s500 = Math.sin(2 * Math.PI * 500 * t);
            let s300 = 0.5 * Math.sin(2 * Math.PI * 300 * t);
            return (s500 + s300) / 1.5;
        } else if (inputType === '3') {
            let val = 0;
            for(let i=0; i < noiseComps.length; i++) {
                val += noiseComps[i].A * Math.sin(2 * Math.PI * noiseComps[i].f * t + noiseComps[i].phi);
            }
            return val;
        } else if (isVoiceInput()) {
            voiceInit();
            return voiceNativeValueAt(voiceNativeSamples, t);
        }
        return 0;
    }

    function calcIdealLpf(t) {
        let val = 0;
        
        if (inputType === '1') {
            let f0 = 500;
            if (f0 <= fc) val += duty * Math.sin(2 * Math.PI * f0 * t);
            let n = 1;
            while (true) {
                let f_up = n * fs + f0;
                let f_down = n * fs - f0; 
                let coef = (1 / (n * Math.PI)) * Math.sin(n * Math.PI * duty);
                if (f_up <= fc) val += coef * Math.sin(2 * Math.PI * f_up * t);
                if (Math.abs(f_down) <= fc) val -= coef * Math.sin(2 * Math.PI * f_down * t);
                if (n * fs - f0 > fc) break; 
                n++; if (n > 50) break; 
            }
        } else if (inputType === '2') {
            const freqs = [300, 500];
            const amps = [0.5/1.5, 1.0/1.5];
            
            for(let k=0; k<2; k++) {
                let f0 = freqs[k];
                let amp = amps[k];
                if (f0 <= fc) val += duty * amp * Math.sin(2 * Math.PI * f0 * t);
                let n = 1;
                while (true) {
                    let f_up = n * fs + f0;
                    let f_down = n * fs - f0; 
                    let coef = (1 / (n * Math.PI)) * Math.sin(n * Math.PI * duty);
                    if (f_up <= fc) val += coef * amp * Math.sin(2 * Math.PI * f_up * t);
                    if (Math.abs(f_down) <= fc) val -= coef * amp * Math.sin(2 * Math.PI * f_down * t);
                    if (n * fs - f0 > fc) break; 
                    n++; if (n > 50) break; 
                }
            }
        } else if (inputType === '3') {
            for(let i=0; i < noiseComps.length; i++) {
                let comp = noiseComps[i];
                if (comp.f <= fc) val += duty * comp.A * Math.sin(2 * Math.PI * comp.f * t + comp.phi);
                let n = 1;
                while (true) {
                    let f_up = n * fs + comp.f;
                    let f_down = n * fs - comp.f;
                    let coef = (1 / (n * Math.PI)) * Math.sin(n * Math.PI * duty);
                    if (f_up <= fc) val += coef * comp.A * Math.sin(2 * Math.PI * f_up * t + comp.phi);
                    if (Math.abs(f_down) <= fc) val -= coef * comp.A * Math.sin(2 * Math.PI * f_down * t - comp.phi);
                    if (n * fs - comp.f > fc) break;
                    n++; if (n > 20) break; 
                }
            }
        } else if (isVoiceInput()) {
            voiceEnsureFiltered();
            return voiceNativeValueAt(voiceFiltered, t);
        }
        return val;
    }

    // Processamento de Audio
    function initAudio() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        scriptNode = audioCtx.createScriptProcessor(2048, 1, 3);
        
        scriptNode.onaudioprocess = function(e) {
            let outOrig = e.outputBuffer.getChannelData(0);
            let outSamp = e.outputBuffer.getChannelData(1);
            let outFilt = e.outputBuffer.getChannelData(2);
            let dtAudio = 1.0 / audioCtx.sampleRate;
            
            if (isVoiceInput()) voiceEnsureFiltered();

            for (let i = 0; i < outOrig.length; i++) {
                let t = audioTime;
                audioTime += dtAudio;

                if (isVoiceInput()) {
                    // Voz: WAV 22,05 kHz -> PB ideal 2 kHz -> chave 0/1 -> PB ideal Fc.
                    // Original, Amostrado e Filtrado são todos calculados na grade de 22,05 kHz.
                    let vt = voiceAudioTime;
                    voiceAudioTime += dtAudio;
                    let o = voiceNativeValueAt(voiceNativeSamples, vt);
                    outOrig[i] = o * 0.3;

                    outSamp[i] = voiceNativeValueAt(voiceSampled, vt) * 0.3;
                    outFilt[i] = voiceNativeValueAt(voiceFiltered, vt) * 0.3;
                } else {
                    let o = getOriginalSignal(t);
                    outOrig[i] = o * 0.3; 
                    
                    let phase = ((t * fs) % 1.0 + 1.0) % 1.0;
                    let isSamp = (phase <= duty / 2.0 || phase >= 1.0 - duty / 2.0);
                    outSamp[i] = isSamp ? o * 0.3 : 0.0;
                    
                    outFilt[i] = calcIdealLpf(t) * 0.3;
                }
            }
        };

        let splitter = audioCtx.createChannelSplitter(3);
        scriptNode.connect(splitter);

        gainOrig = audioCtx.createGain(); gainOrig.gain.value = 0;
        gainSamp = audioCtx.createGain(); gainSamp.gain.value = 0;
        gainFilt = audioCtx.createGain(); gainFilt.gain.value = 0;

        splitter.connect(gainOrig, 0);
        splitter.connect(gainSamp, 1);
        splitter.connect(gainFilt, 2);

        gainOrig.connect(audioCtx.destination);
        gainSamp.connect(audioCtx.destination);
        gainFilt.connect(audioCtx.destination);
    }

    // --- MOTOR DE DESENHO (CANVAS) ---
    function setupCanvas(id) {
        const c = document.getElementById(id);
        const w = c.parentElement.clientWidth; 
        const h = c.parentElement.clientHeight;
        c.width = w * window.devicePixelRatio;
        c.height = h * window.devicePixelRatio;
        return { ctx: c.getContext('2d'), w: c.width, h: c.height };
    }

    function drawGrid(ctx, w, h) {
        ctx.strokeStyle = '#F0F0F5'; ctx.lineWidth = 1.5; ctx.beginPath();
        ctx.moveTo(0, h/2); ctx.lineTo(w, h/2);
        for(let i=1; i<10; i++) {
            ctx.moveTo((w/10)*i, 0); ctx.lineTo((w/10)*i, h);
            ctx.moveTo(0, (h/10)*i); ctx.lineTo(w, (h/10)*i);
        }
        ctx.stroke();
    }

    function drawTimeDomain(ctx, w, h, type, color) {
        const pts = 2500;
        let tWindow;
        if (isVoiceInput()) {
            voiceEnsureFiltered();
            tWindow = Math.min(0.035, voiceNativeSamples.length / voiceSampleRate);
        } else {
            let baseFreq = 500;
            if (inputType === '2') baseFreq = 300;
            if (inputType === '3') baseFreq = 100;
            tWindow = inputType === '3' ? 0.01 : (2 / baseFreq);
        }
        const dt = tWindow / pts;

        ctx.beginPath(); ctx.strokeStyle = color; ctx.lineWidth = 2.5 * window.devicePixelRatio; ctx.lineJoin = 'round';
        let maxOut = 0.001;
        const yData = new Float32Array(pts);

        for (let i = 0; i < pts; i++) {
            const t = i * dt;
            let val = 0;
            if (isVoiceInput()) {
                const tv = voiceDisplayStartTime + t;
                if (type === 'orig') val = voiceNativeValueAt(voiceNativeSamples, tv);
                else if (type === 'samp') val = voiceNativeValueAt(voiceSampled, tv);
                else val = voiceNativeValueAt(voiceFiltered, tv);
            } else {
                const o = getOriginalSignal(t);
                if (type === 'orig') val = o;
                else if (type === 'samp') {
                    const phase = ((t * fs) % 1.0 + 1.0) % 1.0;
                    const isSamp = (phase <= duty / 2.0 || phase >= 1.0 - duty / 2.0);
                    val = isSamp ? o : 0.0;
                } else {
                    val = calcIdealLpf(t);
                }
            }
            yData[i] = val;
            if (Math.abs(val) > maxOut) maxOut = Math.abs(val);
        }

        for (let i = 0; i < pts; i++) {
            let val = yData[i] / maxOut;
            const x = (i / (pts - 1)) * w;
            const safeHeight = h * 0.7;
            const y = (h/2 + 10) - (val * (safeHeight/2) * 0.85);
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.stroke();
    }

    function drawFreqDomain(ctx, w, h, type, color) {
        const maxFreq = 6000; 
        const fullRange = 2 * maxFreq;
        
        if (type === 'samp') {
            let xStart = ((-fc + maxFreq) / fullRange) * w;
            let xEnd = ((fc + maxFreq) / fullRange) * w;
            
            ctx.fillStyle = 'rgba(200, 200, 200, 0.25)'; 
            ctx.fillRect(xStart, 0, xEnd - xStart, h);
            
            ctx.strokeStyle = 'rgba(150, 150, 150, 0.4)';
            ctx.lineWidth = 1 * window.devicePixelRatio;
            ctx.setLineDash([5 * window.devicePixelRatio, 5 * window.devicePixelRatio]);
            ctx.beginPath();
            ctx.moveTo(xStart, 0); ctx.lineTo(xStart, h);
            ctx.moveTo(xEnd, 0); ctx.lineTo(xEnd, h);
            ctx.stroke();
            ctx.setLineDash([]); 
        }

        // Eixo horizontal explícito do espectro. A legenda fica abaixo da linha,
        // evitando que o eixo atravesse os valores de frequência.
        const axisY = h * 0.83;
        ctx.strokeStyle = '#AEB3BA';
        ctx.lineWidth = 1.35 * window.devicePixelRatio;
        ctx.beginPath();
        ctx.moveTo(0, axisY);
        ctx.lineTo(w, axisY);
        ctx.stroke();

        ctx.fillStyle = '#8E8E93';
        ctx.font = `bold ${10 * window.devicePixelRatio}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        
        const refs = [-4000, -2000, 0, 2000, 4000];
        refs.forEach(f => {
            let x = ((f + maxFreq) / fullRange) * w;
            let text = f === 0 ? '0' : (f/1000) + 'k';
            ctx.fillText(text, x, axisY + (7 * window.devicePixelRatio));
        });

        // Uma única escala vertical é usada nos três espectros.
        // A maior componente do Original deve ocupar exatamente 7 divisões da grade.
        // Assim, Amostrado e Filtrado são desenhados na MESMA escala do Original.
        let originalPeakAmp = 1.0;
        if (inputType === '2') {
            originalPeakAmp = 1.0 / 1.5; // maior linha do original 300Hz+500Hz
        } else if (isVoiceInput()) {
            voiceEnsureFiltered();
            // A fala tem picos espectrais estreitos. O máximo da FFT pode cair
            // entre duas posições horizontais do canvas e não ser desenhado.
            // Portanto calibramos pelo maior valor que será REALMENTE traçado
            // nos pixels do gráfico. Isso garante 7 divisões visuais de altura.
            let peak = 1e-12;
            for (let x_px = 0; x_px <= w; x_px++) {
                const f = (x_px / w) * fullRange - maxFreq;
                const a = voiceSpectrumValue(voiceSpectrumOrig, f);
                if (a > peak) peak = a;
            }
            originalPeakAmp = peak;
        }
        const originalReferenceGain = 1.0 / Math.max(originalPeakAmp, 1e-12);
        const spectrumPixelsPerUnit = h * 0.70;
        const spectrumY = (amp) => axisY - (amp * originalReferenceGain * spectrumPixelsPerUnit);

        if (inputType === '3') {
            // Espectro Contínuo para o Ruído (Opção 3)
            ctx.beginPath();
            ctx.moveTo(0, axisY);
            
            for (let x_px = 0; x_px <= w; x_px++) {
                let f = (x_px / w) * fullRange - maxFreq; 
                let amp = 0;
                
                if (type === 'orig') {
                    amp = Math.max(0, 1.0 - Math.abs(f)/500);
                } else {
                    const nMax = Math.ceil((maxFreq + 500) / Math.max(fs, 1)) + 1;
                    for (let n = -nMax; n <= nMax; n++) {
                        let fn = f - n * fs;
                        if (Math.abs(fn) < 500) { 
                            let rawCoef = (duty >= 0.999999) ? (n === 0 ? 1.0 : 0.0) : ((n === 0) ? duty : Math.sin(n * Math.PI * duty) / (n * Math.PI));
                            let localAmp = Math.max(0, 1.0 - Math.abs(fn)/500) * Math.abs(rawCoef);
                            amp += localAmp;
                        }
                    }
                    if (type === 'filt') {
                        if (Math.abs(f) > fc) amp = 0;
                        else amp = amp; 
                    }
                }
                
                let y = spectrumY(amp);
                ctx.lineTo(x_px, y);
            }
            
            ctx.lineTo(w, axisY);
            ctx.closePath();
            
            ctx.fillStyle = color + '80';
            ctx.fill();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2 * window.devicePixelRatio;
            ctx.stroke();

        } else {
            // Espectro Discreto para Senóides e Voz (Opções 1, 2, 4 e 5)
            ctx.strokeStyle = color; ctx.fillStyle = color;
            ctx.lineWidth = 3 * window.devicePixelRatio;
            let radius = 3 * window.devicePixelRatio;

            const drawStem = (f, amp) => {
                if (f < -maxFreq || f > maxFreq) return;
                if (type === 'filt' && Math.abs(f) > fc) return; 
                
                let x = ((f + maxFreq) / fullRange) * w;
                let y = spectrumY(amp); 
                
                ctx.beginPath(); ctx.moveTo(x, axisY); ctx.lineTo(x, y); ctx.stroke();
                ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI*2); ctx.fill();
            };

            if (isVoiceInput()) {
                voiceEnsureFiltered();
                const spec = type === 'orig' ? voiceSpectrumOrig : (type === 'samp' ? voiceDisplaySpectrumSampledAnalog : voiceDisplaySpectrumFilteredAnalog);
                ctx.beginPath();
                for (let x_px = 0; x_px <= w; x_px++) {
                    const f = (x_px / w) * fullRange - maxFreq;
                    const amp = voiceSpectrumValue(spec, f);
                    const y = spectrumY(amp);
                    if (x_px === 0) ctx.moveTo(x_px, y); else ctx.lineTo(x_px, y);
                }
                ctx.strokeStyle = color;
                ctx.lineWidth = 2 * window.devicePixelRatio;
                ctx.stroke();
            } else {
                let freqsToDraw = [];
                if (inputType === '1') freqsToDraw = [{f: 500, a: 1.0}];
                if (inputType === '2') freqsToDraw = [{f: 300, a: 0.5/1.5}, {f: 500, a: 1.0/1.5}];

                if (type === 'orig') {
                    freqsToDraw.forEach(item => {
                        drawStem(item.f, item.a);
                        drawStem(-item.f, item.a);
                    });
                } else {
                    freqsToDraw.forEach(item => {
                        let f0 = item.f;
                        let baseAmp = item.a;
                        const nMax = Math.ceil((maxFreq + f0) / Math.max(fs, 1)) + 1;
                        for (let n = -nMax; n <= nMax; n++) {
                            let f_up = n * fs + f0;
                            let f_down = n * fs - f0;
                            
                            let rawCoef = (duty >= 0.999999) ? (n === 0 ? 1.0 : 0.0) : ((n === 0) ? duty : Math.sin(n * Math.PI * duty) / (n * Math.PI));
                            let amp = Math.abs(rawCoef) * baseAmp;
                            if (type === 'filt') amp = amp; 
                            
                            drawStem(f_up, amp);
                            drawStem(f_down, amp);
                        }
                    });
                }
            }
        }
    }

    function drawLPBlock() {
        const c = document.getElementById('canvas-lp');
        if (!c || !c.parentElement) return;
        const wCss = c.parentElement.clientWidth || 100;
        const hCss = c.parentElement.clientHeight || 80;
        c.width = wCss * window.devicePixelRatio;
        c.height = hCss * window.devicePixelRatio;
        const ctx = c.getContext('2d');
        const w = c.width, h = c.height;
        ctx.clearRect(0, 0, w, h);

        const padL = 18 * window.devicePixelRatio;
        const padR = 16 * window.devicePixelRatio;
        const padT = 14 * window.devicePixelRatio;
        const padB = 18 * window.devicePixelRatio;
        const x0 = padL;
        const x1 = w - padR;
        const y0 = h - padB;
        const yTop = padT;
        const usableW = Math.max(10, x1 - x0);
        const cutoffX = x0 + Math.max(0, Math.min(1, fc / 6000)) * usableW;

        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1.5 * window.devicePixelRatio;
        ctx.beginPath();
        ctx.moveTo(x0, yTop);
        ctx.lineTo(x0, y0);
        ctx.lineTo(x1, y0);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(0,0,0,0.14)';
        ctx.setLineDash([4 * window.devicePixelRatio, 4 * window.devicePixelRatio]);
        ctx.beginPath();
        ctx.moveTo(cutoffX, yTop);
        ctx.lineTo(cutoffX, y0);
        ctx.stroke();
        ctx.setLineDash([]);

        const passY = yTop + 0.18 * (y0 - yTop);
        const stopY = yTop + 0.78 * (y0 - yTop);
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 2.6 * window.devicePixelRatio;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x0, passY);
        ctx.lineTo(cutoffX, passY);
        ctx.lineTo(cutoffX, stopY);
        ctx.lineTo(x1, stopY);
        ctx.stroke();

        ctx.fillStyle = '#000';
        ctx.font = `${10 * window.devicePixelRatio}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        ctx.fillText('0', x0, y0 + 2 * window.devicePixelRatio);
        ctx.fillText('Fc', cutoffX, y0 + 2 * window.devicePixelRatio);

        ctx.save();
        ctx.translate(7 * window.devicePixelRatio, (yTop + y0) / 2);
        ctx.rotate(-Math.PI / 2);
        ctx.font = `${10 * window.devicePixelRatio}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('|H(f)|', 0, 0);
        ctx.restore();
    }

    function drawAll() {
        const colorOrig = '#FF453A';
        const colorBlue = '#007AFF';
        const colorMagenta = '#FF00FF';

        const cOrig = setupCanvas('canvas-orig');
        cOrig.ctx.clearRect(0,0, cOrig.w, cOrig.h); drawGrid(cOrig.ctx, cOrig.w, cOrig.h);
        if(viewDomain === 'time') drawTimeDomain(cOrig.ctx, cOrig.w, cOrig.h, 'orig', colorOrig);
        else drawFreqDomain(cOrig.ctx, cOrig.w, cOrig.h, 'orig', colorOrig);

        const cSamp = setupCanvas('canvas-samp');
        cSamp.ctx.clearRect(0,0, cSamp.w, cSamp.h); drawGrid(cSamp.ctx, cSamp.w, cSamp.h);
        if(viewDomain === 'time') drawTimeDomain(cSamp.ctx, cSamp.w, cSamp.h, 'samp', colorBlue);
        else drawFreqDomain(cSamp.ctx, cSamp.w, cSamp.h, 'samp', colorBlue);

        const cFilt = setupCanvas('canvas-filt');
        cFilt.ctx.clearRect(0,0, cFilt.w, cFilt.h); drawGrid(cFilt.ctx, cFilt.w, cFilt.h);
        if(viewDomain === 'time') drawTimeDomain(cFilt.ctx, cFilt.w, cFilt.h, 'filt', colorMagenta);
        else drawFreqDomain(cFilt.ctx, cFilt.w, cFilt.h, 'filt', colorMagenta);
        
        const cSw = document.getElementById('canvas-switch');
        cSw.width = (cSw.parentElement.clientWidth || 100) * window.devicePixelRatio;
        cSw.height = (cSw.parentElement.clientHeight || 100) * window.devicePixelRatio;

        drawLPBlock();
    }

    // --- ANIMAÇÃO DA CHAVE DO MEIO ---
    function animateSwitch() {
        const c = document.getElementById('canvas-switch');
        const w = c.width; const h = c.height;
        if (w > 0 && h > 0) {
            const ctx = c.getContext('2d');
            ctx.clearRect(0, 0, w, h);
            
            ctx.strokeStyle = '#000'; ctx.lineWidth = 4 * window.devicePixelRatio; ctx.lineCap = 'round';
            
            const time = performance.now() / 1000;
            const anim = (Math.sin(time * 3 * Math.PI * 2) + 1) / 2; // 3Hz
            const tipY = h/2 - (anim * h * 0.4); 

            ctx.beginPath();
            ctx.moveTo(w*0.05, h/2); ctx.lineTo(w*0.35, h/2);
            ctx.moveTo(w*0.35, h/2); ctx.lineTo(w*0.65, tipY);
            ctx.moveTo(w*0.65, h/2); ctx.lineTo(w*0.95, h/2);
            ctx.stroke();

            ctx.fillStyle = '#000';
            let radius = 4 * window.devicePixelRatio;
            ctx.beginPath(); ctx.arc(w*0.35, h/2, radius, 0, Math.PI*2); ctx.fill();
            ctx.beginPath(); ctx.arc(w*0.65, h/2, radius, 0, Math.PI*2); ctx.fill();
        }
        requestAnimationFrame(animateSwitch);
    }

    // --- INICIALIZAÇÃO ---
    window.addEventListener('load', () => {
        if (isMobileLike() && !isNativeFullscreen()) setMobileNavigationMode(true);
        drawAll();
        requestAnimationFrame(animateSwitch);
    });
    window.addEventListener('resize', () => {
        updateMobileStageGeometry();
        drawAll();
    });

</script>
</body>
