<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Crane Sway</title>
<style>
  :root {
    --bg: #f4f6f8;
    --panel: rgba(255,255,255,.92);
    --ink: #1e2933;
    --muted: #6b7785;
    --accent: #e3a008;
    --danger: #c2413b;
    --ok: #2d8a57;
    --line: #cfd6dc;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  #game {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  .hud {
    position: fixed;
    inset: 24px 24px auto 24px;
    display: flex;
    justify-content: space-between;
    gap: 18px;
    pointer-events: none;
  }

  .card {
    background: var(--panel);
    border: 1px solid rgba(30,41,51,.08);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 0 10px 30px rgba(22,31,40,.08);
    backdrop-filter: blur(10px);
  }

  .title {
    font-size: 16px;
    font-weight: 750;
    letter-spacing: -.02em;
  }

  .subtitle {
    margin-top: 3px;
    font-size: 12px;
    color: var(--muted);
  }

  .status {
    text-align: right;
    min-width: 180px;
  }

  .metric {
    font-size: 12px;
    color: var(--muted);
  }

  .metric strong {
    color: var(--ink);
    font-size: 20px;
    display: block;
    margin-top: 2px;
  }

  .controls {
    position: fixed;
    left: 50%;
    bottom: max(14px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--panel);
    border: 1px solid rgba(30,41,51,.08);
    border-radius: 18px;
    padding: 10px 12px;
    box-shadow: 0 10px 30px rgba(22,31,40,.08);
    user-select: none;
  }

  .key {
    width: 58px;
    height: 58px;
    border-radius: 12px;
    border: 1px solid #d8dde2;
    background: #fff;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 18px;
    color: var(--ink);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.04);
  }

  .key.active {
    transform: translateY(1px);
    background: #edf1f4;
  }

  .divider {
    width: 1px;
    height: 34px;
    background: #d8dde2;
    margin: 0 2px;
  }

  .message {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    min-width: min(460px, calc(100vw - 40px));
    padding: 26px;
    border-radius: 20px;
    background: rgba(255,255,255,.96);
    border: 1px solid rgba(30,41,51,.08);
    box-shadow: 0 22px 70px rgba(22,31,40,.18);
    text-align: center;
    display: none;
  }

  .message.show { display: block; }

  .message h2 {
    margin: 0 0 8px;
    font-size: 28px;
  }

  .message p {
    margin: 0 0 18px;
    color: var(--muted);
    line-height: 1.5;
  }

  button {
    appearance: none;
    border: none;
    border-radius: 12px;
    background: var(--ink);
    color: white;
    font-weight: 700;
    padding: 12px 18px;
    cursor: pointer;
    font-size: 14px;
  }

  @media (max-width: 700px) {
    .hud {
      inset: max(10px, env(safe-area-inset-top)) 10px auto 10px;
      gap: 8px;
    }

    .card {
      padding: 10px 12px;
      border-radius: 14px;
    }

    .title {
      font-size: 14px;
    }

    .subtitle {
      max-width: 190px;
      font-size: 11px;
      line-height: 1.25;
    }

    .status {
      min-width: 96px;
    }

    .metric strong {
      font-size: 17px;
    }

    .controls {
      width: calc(100vw - 20px);
      max-width: 390px;
      justify-content: center;
      gap: 12px;
      padding: 12px;
      border-radius: 20px;
    }

    .key {
      width: 64px;
      height: 64px;
      font-size: 24px;
      border-radius: 16px;
    }

    .divider {
      height: 44px;
    }

    .message {
      top: 46%;
      padding: 22px;
    }
  }

  @media (max-height: 560px) and (orientation: landscape) {
    .hud {
      inset: 8px 8px auto 8px;
    }

    .subtitle {
      display: none;
    }

    .controls {
      left: auto;
      right: 10px;
      bottom: max(8px, env(safe-area-inset-bottom));
      transform: none;
      width: auto;
      padding: 8px;
      gap: 8px;
    }

    .key {
      width: 50px;
      height: 50px;
      font-size: 20px;
    }

    .divider {
      height: 34px;
    }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="card">
    <div class="title">Transporte de carga pesada</div>
    <div class="subtitle">Retire a carga de A e encaixe-a em B. Use os botões ou as setas do teclado.</div>
  </div>
  <div class="card status">
    <div class="metric">Tempo<strong id="timer">0.0 s</strong></div>
  </div>
</div>

<div class="controls" aria-label="Controles">
  <div class="key" data-key="ArrowLeft">←</div>
  <div class="key" data-key="ArrowRight">→</div>
  <div class="divider"></div>
  <div class="key" data-key="ArrowUp">↑</div>
  <div class="key" data-key="ArrowDown">↓</div>
</div>

<div class="message" id="message">
  <h2 id="messageTitle">Carga posicionada</h2>
  <p id="result"></p>
  <button id="restart">Jogar novamente</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const timerEl = document.getElementById('timer');
  const messageEl = document.getElementById('message');
  const messageTitleEl = document.getElementById('messageTitle');
  const resultEl = document.getElementById('result');
  const restartBtn = document.getElementById('restart');
  const keyEls = [...document.querySelectorAll('.key')];

  let W = innerWidth;
  let H = innerHeight;
  let dpr = Math.min(devicePixelRatio || 1, 2);

  const keys = Object.create(null);

  const state = {
    trolleyX: 0,
    trolleyV: 0,
    ropeLength: 0,
    ropeV: 0,
    angle: 0,
    angleV: 0,
    startTime: 0,
    finished: false,
    settleTime: 0
  };

  const physics = {
    gravity: 9.81,
    horizontalAccel: 7.3,
    maxTrolleySpeed: 5.2,
    trolleyDrag: 1.75,
    hoistSpeed: 2.0,
    minRope: 2.7,
    maxRope: 8.4,
    angularDamping: 0.055
  };

  const geometry = {
    startX: 2.1,
    targetX: 12.15,
    loadHalfWidthPx: 66,
    loadTopOffsetPx: -6,
    loadBottomOffsetPx: 36,
    obstacleWidthPx: 24,
    obstacleHeightPx: 128,
    targetHalfGapPx: 92,
    desiredLoadEndpointAboveGroundPx: 54
  };

  function sceneGeometry() {
    const g = world();
    const sx = g.scaleX;
    const sy = g.scaleY;
    const hookY = g.railY + 7;
    const desiredLoadY = g.groundY - geometry.desiredLoadEndpointAboveGroundPx;
    const startScreenX = g.left + geometry.startX * sx;
    const targetScreenX = g.left + geometry.targetX * sx;
    const wallTop = g.groundY - geometry.obstacleHeightPx;

    return {
      g, sx, sy, hookY, desiredLoadY, startScreenX, targetScreenX, wallTop,
      leftWall: {
        x: targetScreenX - geometry.targetHalfGapPx - geometry.obstacleWidthPx,
        y: wallTop,
        w: geometry.obstacleWidthPx,
        h: geometry.obstacleHeightPx
      },
      rightWall: {
        x: targetScreenX + geometry.targetHalfGapPx,
        y: wallTop,
        w: geometry.obstacleWidthPx,
        h: geometry.obstacleHeightPx
      }
    };
  }

  function loadScreenState(scene = sceneGeometry()) {
    const x = scene.g.left + state.trolleyX * scene.sx
      + state.ropeLength * Math.sin(state.angle) * scene.sx;
    const y = scene.hookY
      + state.ropeLength * Math.cos(state.angle) * scene.sy;

    return {
      x,
      y,
      left: x - geometry.loadHalfWidthPx,
      right: x + geometry.loadHalfWidthPx,
      top: y + geometry.loadTopOffsetPx,
      bottom: y + geometry.loadBottomOffsetPx
    };
  }

  function rectanglesOverlap(a, b) {
    return a.left < b.x + b.w &&
           a.right > b.x &&
           a.top < b.y + b.h &&
           a.bottom > b.y;
  }

  function resize() {
    W = Math.round(window.visualViewport?.width || innerWidth);
    H = Math.round(window.visualViewport?.height || innerHeight);
    dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    reset();
  }

  function world() {
    const horizontalMargin = W < 700 ? 22 : Math.max(70, W * 0.07);
    const left = horizontalMargin;
    const right = W - horizontalMargin;
    const railY = Math.max(W < 700 ? 118 : 145, H * 0.20);
    const groundY = H - Math.max(W < 700 ? 102 : 95, H * 0.15);
    const scaleX = (right - left) / 15;
    const scaleY = Math.max(20, (groundY - railY) / 9);
    return { left, right, railY, groundY, scaleX, scaleY };
  }

  function reset() {
    const scene = sceneGeometry();
    state.trolleyX = geometry.startX;
    state.trolleyV = 0;
    state.ropeLength = Math.max(
      physics.minRope,
      Math.min(physics.maxRope, (scene.desiredLoadY - scene.hookY) / scene.sy)
    );
    state.ropeV = 0;
    state.angle = 0;
    state.angleV = 0;
    state.startTime = performance.now();
    state.finished = false;
    state.settleTime = 0;
    messageTitleEl.textContent = 'Carga posicionada';
    messageEl.classList.remove('show');
  }

  function inputAxis() {
    return (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
  }

  function hoistAxis() {
    return (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0);
  }

  function update(dt) {
    if (state.finished) return;

    const horizontal = inputAxis();
    const vertical = hoistAxis();

    const previousV = state.trolleyV;
    state.trolleyV += horizontal * physics.horizontalAccel * dt;
    state.trolleyV *= Math.exp(-physics.trolleyDrag * dt);
    state.trolleyV = Math.max(-physics.maxTrolleySpeed, Math.min(physics.maxTrolleySpeed, state.trolleyV));
    state.trolleyX += state.trolleyV * dt;

    const minX = 0.9;
    const maxX = 14.1;
    if (state.trolleyX < minX) { state.trolleyX = minX; state.trolleyV = 0; }
    if (state.trolleyX > maxX) { state.trolleyX = maxX; state.trolleyV = 0; }

    state.ropeV = vertical * physics.hoistSpeed;
    state.ropeLength += state.ropeV * dt;
    state.ropeLength = Math.max(physics.minRope, Math.min(physics.maxRope, state.ropeLength));

    const trolleyAccel = (state.trolleyV - previousV) / Math.max(dt, 1e-4);
    const L = state.ropeLength;

    const angleAcc =
      -(physics.gravity / L) * Math.sin(state.angle)
      -(trolleyAccel / L) * Math.cos(state.angle)
      - physics.angularDamping * state.angleV;

    state.angleV += angleAcc * dt;
    state.angle += state.angleV * dt;

    const scene = sceneGeometry();
    const load = loadScreenState(scene);

    if (rectanglesOverlap(load, scene.leftWall) || rectanglesOverlap(load, scene.rightWall)) {
      fail('A carga colidiu com um dos obstáculos laterais de B.');
      return;
    }

    const positionErrorPx = Math.hypot(
      load.x - scene.targetScreenX,
      load.y - scene.desiredLoadY
    );
    const calmEnough =
      Math.abs(state.angle) < 0.045 &&
      Math.abs(state.angleV) < 0.085 &&
      Math.abs(state.trolleyV) < 0.11 &&
      Math.abs(state.ropeV) < 0.05;

    const horizontallyInside =
      load.left > scene.leftWall.x + scene.leftWall.w &&
      load.right < scene.rightWall.x;

    const verticallyPlaced = Math.abs(load.y - scene.desiredLoadY) < 15;
    const insideTarget = horizontallyInside && verticallyPlaced && positionErrorPx < 18;

    if (insideTarget && calmEnough) {
      state.settleTime += dt;
      if (state.settleTime > 0.85) finish();
    } else {
      state.settleTime = 0;
    }

    timerEl.textContent = ((performance.now() - state.startTime) / 1000).toFixed(1) + ' s';
  }

  function finish() {
    state.finished = true;
    const elapsed = ((performance.now() - state.startTime) / 1000).toFixed(1);
    messageTitleEl.textContent = 'Carga posicionada';
    resultEl.textContent = `Você concluiu o transporte em ${elapsed} segundos sem tocar nos obstáculos.`;
    messageEl.classList.add('show');
  }

  function fail(reason) {
    if (state.finished) return;
    state.finished = true;
    messageTitleEl.textContent = 'Colisão';
    resultEl.textContent = `${reason} Reinicie e tente controlar melhor o balanço da carga.`;
    messageEl.classList.add('show');
  }

  function drawRoundedRect(x, y, w, h, r, fill, stroke) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
  }

  function render() {
    const scene = sceneGeometry();
    const g = scene.g;
    const sx = scene.sx;

    ctx.clearRect(0, 0, W, H);

    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#eef2f5');
    sky.addColorStop(1, '#dde4e9');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#d0d7dc';
    ctx.fillRect(0, g.groundY, W, H - g.groundY);

    // distant buildings
    ctx.fillStyle = 'rgba(92,106,116,.12)';
    for (let i = 0; i < 9; i++) {
      const bw = 70 + (i % 3) * 25;
      const bh = 80 + (i % 4) * 24;
      ctx.fillRect(i * (W/8) - 20, g.groundY - bh, bw, bh);
    }

    // crane mast and jib
    const mastX = g.right - sx * 0.8;
    ctx.strokeStyle = '#b47a0a';
    ctx.lineWidth = 5;
    ctx.strokeRect(mastX, g.railY - 20, 42, g.groundY - g.railY + 20);

    ctx.strokeStyle = '#c18a13';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(g.left, g.railY);
    ctx.lineTo(g.right, g.railY);
    ctx.stroke();

    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(128,86,6,.72)';
    for (let x = g.left; x < g.right; x += 34) {
      ctx.beginPath();
      ctx.moveTo(x, g.railY - 18);
      ctx.lineTo(x + 34, g.railY + 18);
      ctx.moveTo(x, g.railY + 18);
      ctx.lineTo(x + 34, g.railY - 18);
      ctx.stroke();
    }

    const toScreenX = x => g.left + x * sx;
    const trolleyScreenX = toScreenX(state.trolleyX);

    // trolley
    drawRoundedRect(trolleyScreenX - 25, g.railY - 11, 50, 22, 5, '#343b40');
    ctx.fillStyle = '#1f2529';
    ctx.beginPath();
    ctx.arc(trolleyScreenX - 15, g.railY + 13, 5, 0, Math.PI*2);
    ctx.arc(trolleyScreenX + 15, g.railY + 13, 5, 0, Math.PI*2);
    ctx.fill();

    // load geometry
    const hookX = trolleyScreenX;
    const hookY = scene.hookY;
    const currentLoad = loadScreenState(scene);
    const loadX = currentLoad.x;
    const loadY = currentLoad.y;

    ctx.strokeStyle = '#3c444a';
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(hookX, hookY);
    ctx.lineTo(loadX, loadY - 35);
    ctx.stroke();

    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(loadX, loadY - 35);
    ctx.lineTo(loadX - 42, loadY - 2);
    ctx.moveTo(loadX, loadY - 35);
    ctx.lineTo(loadX + 42, loadY - 2);
    ctx.stroke();

    // shadow
    const shadowScale = Math.max(.35, 1 - (g.groundY - loadY)/500);
    ctx.fillStyle = 'rgba(24,30,34,.14)';
    ctx.beginPath();
    ctx.ellipse(loadX, g.groundY + 4, 74 * shadowScale, 17 * shadowScale, 0, 0, Math.PI*2);
    ctx.fill();

    // load
    ctx.save();
    ctx.translate(loadX, loadY + 12);
    ctx.rotate(state.angle * 0.18);
    drawRoundedRect(-66, -18, 132, 42, 5, '#70787d', '#50585d');
    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.fillRect(-56, -10, 112, 7);
    ctx.fillStyle = 'rgba(45,50,54,.25)';
    for (let i = -48; i <= 48; i += 24) {
      ctx.beginPath();
      ctx.arc(i, 8 + ((i/24)%2)*4, 4, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.restore();

    // Exact starting point A and constrained target B.
    const startX = scene.startScreenX;
    const targetX = scene.targetScreenX;
    const platformY = scene.desiredLoadY + geometry.loadBottomOffsetPx + 4;

    ctx.save();
    ctx.setLineDash([7, 7]);
    ctx.lineWidth = 2;

    ctx.strokeStyle = 'rgba(194,65,59,.82)';
    ctx.strokeRect(
      startX - geometry.loadHalfWidthPx - 8,
      scene.desiredLoadY + geometry.loadTopOffsetPx - 8,
      geometry.loadHalfWidthPx * 2 + 16,
      geometry.loadBottomOffsetPx - geometry.loadTopOffsetPx + 16
    );
    ctx.fillStyle = 'rgba(194,65,59,.07)';
    ctx.fillRect(
      startX - geometry.loadHalfWidthPx - 8,
      scene.desiredLoadY + geometry.loadTopOffsetPx - 8,
      geometry.loadHalfWidthPx * 2 + 16,
      geometry.loadBottomOffsetPx - geometry.loadTopOffsetPx + 16
    );

    ctx.strokeStyle = 'rgba(45,138,87,.9)';
    ctx.strokeRect(
      targetX - geometry.targetHalfGapPx,
      scene.desiredLoadY + geometry.loadTopOffsetPx - 8,
      geometry.targetHalfGapPx * 2,
      geometry.loadBottomOffsetPx - geometry.loadTopOffsetPx + 16
    );
    ctx.fillStyle = 'rgba(45,138,87,.08)';
    ctx.fillRect(
      targetX - geometry.targetHalfGapPx,
      scene.desiredLoadY + geometry.loadTopOffsetPx - 8,
      geometry.targetHalfGapPx * 2,
      geometry.loadBottomOffsetPx - geometry.loadTopOffsetPx + 16
    );
    ctx.restore();

    // Platforms.
    ctx.fillStyle = '#8f989e';
    ctx.fillRect(startX - 82, platformY, 164, 10);
    ctx.fillRect(targetX - geometry.targetHalfGapPx, platformY, geometry.targetHalfGapPx * 2, 10);

    // Lateral collision obstacles at B.
    const wallGradient = ctx.createLinearGradient(0, scene.wallTop, 0, g.groundY);
    wallGradient.addColorStop(0, '#9a4b3d');
    wallGradient.addColorStop(1, '#71352e');
    ctx.fillStyle = wallGradient;
    ctx.fillRect(scene.leftWall.x, scene.leftWall.y, scene.leftWall.w, scene.leftWall.h);
    ctx.fillRect(scene.rightWall.x, scene.rightWall.y, scene.rightWall.w, scene.rightWall.h);

    ctx.fillStyle = 'rgba(255,255,255,.18)';
    for (const wall of [scene.leftWall, scene.rightWall]) {
      for (let y = wall.y + 12; y < wall.y + wall.h; y += 22) {
        ctx.fillRect(wall.x + 4, y, wall.w - 8, 4);
      }
    }

    ctx.font = '700 15px Inter, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillStyle = '#b43f39';
    ctx.fillText('A', startX, scene.desiredLoadY + geometry.loadTopOffsetPx - 17);
    ctx.fillStyle = '#28784e';
    ctx.fillText('B', targetX, scene.wallTop - 12);

    // sway indicator
    const sway = Math.min(1, Math.abs(state.angle) / 0.35);
    const barW = 150;
    const bx = W - 24 - barW;
    const by = 128;
    ctx.fillStyle = 'rgba(255,255,255,.78)';
    drawRoundedRect(bx, by, barW, 10, 5, 'rgba(255,255,255,.78)');
    drawRoundedRect(bx, by, barW * sway, 10, 5, sway < .35 ? '#2d8a57' : sway < .7 ? '#d28b10' : '#c2413b');
    ctx.fillStyle = '#6b7785';
    ctx.textAlign = 'left';
    ctx.font = '12px Inter, system-ui, sans-serif';
    ctx.fillText('Balanço', bx, by - 7);
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.025);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function normalizeControlKey(key) {
    const lower = key.toLowerCase();
    const map = { a: 'ArrowLeft', d: 'ArrowRight', w: 'ArrowUp', s: 'ArrowDown' };
    return map[lower] || key;
  }

  function refreshKeyIndicators() {
    keyEls.forEach(el => el.classList.toggle('active', Boolean(keys[el.dataset.key])));
  }

  addEventListener('keydown', e => {
    const controlKey = normalizeControlKey(e.key);
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(controlKey)) {
      e.preventDefault();
      keys[controlKey] = true;
      refreshKeyIndicators();
    }
  });

  addEventListener('keyup', e => {
    const controlKey = normalizeControlKey(e.key);
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(controlKey)) {
      e.preventDefault();
      keys[controlKey] = false;
      refreshKeyIndicators();
    }
  });

  // Touch/mouse support
  keyEls.forEach(el => {
    const k = el.dataset.key;

    const on = e => {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      keys[k] = true;
      el.classList.add('active');
    };

    const off = e => {
      e.preventDefault();
      keys[k] = false;
      el.classList.remove('active');
      try { el.releasePointerCapture(e.pointerId); } catch (_) {}
    };

    el.addEventListener('pointerdown', on, { passive: false });
    el.addEventListener('pointerup', off, { passive: false });
    el.addEventListener('pointercancel', off, { passive: false });
    el.addEventListener('lostpointercapture', off, { passive: false });
  });

  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  addEventListener('blur', () => {
    Object.keys(keys).forEach(k => keys[k] = false);
    keyEls.forEach(el => el.classList.remove('active'));
  });

  restartBtn.addEventListener('click', reset);
  addEventListener('resize', resize);
  window.visualViewport?.addEventListener('resize', resize);
  window.visualViewport?.addEventListener('scroll', resize);

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
