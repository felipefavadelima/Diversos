<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Crane Sway</title>
<style>
  :root {
    --bg: #f4f6f8;
    --panel: rgba(255,255,255,.92);
    --ink: #1e2933;
    --muted: #6b7785;
    --accent: #e3a008;
    --danger: #c2413b;
    --ok: #2d8a57;
    --line: #cfd6dc;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  #game {
    display: block;
    width: 100vw;
    height: 100vh;
  }

  .hud {
    position: fixed;
    inset: 24px 24px auto 24px;
    display: flex;
    justify-content: space-between;
    gap: 18px;
    pointer-events: none;
  }

  .card {
    background: var(--panel);
    border: 1px solid rgba(30,41,51,.08);
    border-radius: 16px;
    padding: 14px 16px;
    box-shadow: 0 10px 30px rgba(22,31,40,.08);
    backdrop-filter: blur(10px);
  }

  .title {
    font-size: 16px;
    font-weight: 750;
    letter-spacing: -.02em;
  }

  .subtitle {
    margin-top: 3px;
    font-size: 12px;
    color: var(--muted);
  }

  .status {
    text-align: right;
    min-width: 180px;
  }

  .metric {
    font-size: 12px;
    color: var(--muted);
  }

  .metric strong {
    color: var(--ink);
    font-size: 20px;
    display: block;
    margin-top: 2px;
  }

  .controls {
    position: fixed;
    left: 50%;
    bottom: max(14px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    align-items: center;
    background: var(--panel);
    border: 1px solid rgba(30,41,51,.08);
    border-radius: 18px;
    padding: 10px 12px;
    box-shadow: 0 10px 30px rgba(22,31,40,.08);
    user-select: none;
  }

  .key {
    width: 58px;
    height: 58px;
    border-radius: 12px;
    border: 1px solid #d8dde2;
    background: #fff;
    display: grid;
    place-items: center;
    font-weight: 800;
    font-size: 18px;
    color: var(--ink);
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.04);
  }

  .key.active {
    transform: translateY(1px);
    background: #edf1f4;
  }

  .divider {
    width: 1px;
    height: 34px;
    background: #d8dde2;
    margin: 0 2px;
  }

  .message {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    min-width: min(460px, calc(100vw - 40px));
    padding: 26px;
    border-radius: 20px;
    background: rgba(255,255,255,.96);
    border: 1px solid rgba(30,41,51,.08);
    box-shadow: 0 22px 70px rgba(22,31,40,.18);
    text-align: center;
    display: none;
  }

  .message.show { display: block; }

  .message h2 {
    margin: 0 0 8px;
    font-size: 28px;
  }

  .message p {
    margin: 0 0 18px;
    color: var(--muted);
    line-height: 1.5;
  }

  button {
    appearance: none;
    border: none;
    border-radius: 12px;
    background: var(--ink);
    color: white;
    font-weight: 700;
    padding: 12px 18px;
    cursor: pointer;
    font-size: 14px;
  }

  @media (max-width: 700px) {
    .hud {
      inset: max(10px, env(safe-area-inset-top)) 10px auto 10px;
      gap: 8px;
    }

    .card {
      padding: 10px 12px;
      border-radius: 14px;
    }

    .title {
      font-size: 14px;
    }

    .subtitle {
      max-width: 190px;
      font-size: 11px;
      line-height: 1.25;
    }

    .status {
      min-width: 96px;
    }

    .metric strong {
      font-size: 17px;
    }

    .controls {
      width: calc(100vw - 20px);
      max-width: 390px;
      justify-content: center;
      gap: 12px;
      padding: 12px;
      border-radius: 20px;
    }

    .key {
      width: 64px;
      height: 64px;
      font-size: 24px;
      border-radius: 16px;
    }

    .divider {
      height: 44px;
    }

    .message {
      top: 46%;
      padding: 22px;
    }
  }

  @media (max-height: 560px) and (orientation: landscape) {
    .hud {
      inset: 8px 8px auto 8px;
    }

    .subtitle {
      display: none;
    }

    .controls {
      left: 50%;
      right: auto;
      bottom: max(7px, env(safe-area-inset-bottom));
      transform: translateX(-50%);
      width: auto;
      max-width: calc(100vw - 24px);
      padding: 7px 9px;
      gap: 7px;
      border-radius: 16px;
    }

    .key {
      width: 48px;
      height: 48px;
      font-size: 20px;
      border-radius: 13px;
    }

    .divider {
      height: 32px;
    }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="card">
    <div class="title">Transporte de carga pesada</div>
    <div class="subtitle">Retire a carga de A e encaixe-a em B. Use os botões ou as setas do teclado.</div>
  </div>
  <div class="card status">
    <div class="metric">Tempo<strong id="timer">0.0 s</strong></div>
  </div>
</div>

<div class="controls" aria-label="Controles">
  <div class="key" data-key="ArrowLeft">←</div>
  <div class="key" data-key="ArrowRight">→</div>
  <div class="divider"></div>
  <div class="key" data-key="ArrowUp">↑</div>
  <div class="key" data-key="ArrowDown">↓</div>
</div>

<div class="message" id="message">
  <h2 id="messageTitle">Carga posicionada</h2>
  <p id="result"></p>
  <button id="restart">Jogar novamente</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const timerEl = document.getElementById('timer');
  const messageEl = document.getElementById('message');
  const messageTitleEl = document.getElementById('messageTitle');
  const resultEl = document.getElementById('result');
  const restartBtn = document.getElementById('restart');
  const keyEls = [...document.querySelectorAll('.key')];

  let W = innerWidth;
  let H = innerHeight;
  let dpr = Math.min(devicePixelRatio || 1, 2);

  const keys = Object.create(null);

  const state = {
    trolleyX: 0,
    trolleyV: 0,
    ropeLength: 0,
    ropeV: 0,
    angle: 0,
    angleV: 0,
    startTime: 0,
    finished: false,
    settleTime: 0
  };

  const physics = {
    gravity: 9.81,
    horizontalAccel: 7.3,
    maxTrolleySpeed: 5.2,
    trolleyDrag: 1.75,
    hoistSpeed: 2.0,
    minRope: 2.7,
    maxRope: 9.2,
    angularDamping: 0.055
  };

  const geometry = {
    startX: 2.1,
    targetXDesktop: 12.15,
    targetXPortrait: 11.45,
    baseLoadHalfWidth: 66,
    baseLoadTopOffset: -6,
    baseLoadBottomOffset: 36,
    baseObstacleWidth: 22,
    baseClearance: 28,
    baseWallExtraTop: 30
  };

  function responsiveObjectScale() {
    // The visual objects scale from the most restrictive viewport dimension.
    // This prevents oversized obstacles in landscape and an excessively narrow
    // opening in portrait mode.
    const widthScale = W / 900;
    const heightScale = H / 650;
    return Math.max(0.62, Math.min(1, widthScale, heightScale));
  }

  function sceneGeometry() {
    const g = world();
    const sx = g.scaleX;
    const sy = g.scaleY;
    const k = responsiveObjectScale();

    const loadHalfWidth = geometry.baseLoadHalfWidth * k;
    const loadTopOffset = geometry.baseLoadTopOffset * k;
    const loadBottomOffset = geometry.baseLoadBottomOffset * k;
    const loadWidth = 2 * loadHalfWidth;
    const loadHeight = loadBottomOffset - loadTopOffset;

    const clearance = Math.max(18, geometry.baseClearance * k);
    const targetHalfGap = loadHalfWidth + clearance;
    const obstacleWidth = Math.max(14, geometry.baseObstacleWidth * k);
    const platformThickness = Math.max(8, 10 * k);

    const portrait = H > W;
    const targetWorldX = portrait
      ? geometry.targetXPortrait
      : geometry.targetXDesktop;

    const hookY = g.railY + 7;
    const desiredLoadY =
      g.groundY - loadBottomOffset - platformThickness - 6;
    const platformY = desiredLoadY + loadBottomOffset + 4;

    // The walls rise only slightly above the top of the load. Their height is
    // therefore proportional to the object, not to the full screen.
    const wallExtraTop = Math.max(22, geometry.baseWallExtraTop * k);
    const wallTop = platformY - loadHeight - wallExtraTop;
    const wallBottom = platformY + platformThickness;
    const obstacleHeight = wallBottom - wallTop;

    const startScreenX = g.left + geometry.startX * sx;
    const targetScreenX = g.left + targetWorldX * sx;

    return {
      g, sx, sy, k, hookY, desiredLoadY, platformY,
      startScreenX, targetScreenX, targetWorldX,
      loadHalfWidth, loadWidth, loadHeight,
      loadTopOffset, loadBottomOffset,
      targetHalfGap, obstacleWidth,
      platformThickness, wallTop, wallBottom,
      leftWall: {
        x: targetScreenX - targetHalfGap - obstacleWidth,
        y: wallTop,
        w: obstacleWidth,
        h: obstacleHeight
      },
      rightWall: {
        x: targetScreenX + targetHalfGap,
        y: wallTop,
        w: obstacleWidth,
        h: obstacleHeight
      }
    };
  }

  function loadScreenState(scene = sceneGeometry()) {
    const x = scene.g.left + state.trolleyX * scene.sx
      + state.ropeLength * Math.sin(state.angle) * scene.sx;
    const y = scene.hookY
      + state.ropeLength * Math.cos(state.angle) * scene.sy;

    return {
      x,
      y,
      left: x - scene.loadHalfWidth,
      right: x + scene.loadHalfWidth,
      top: y + scene.loadTopOffset,
      bottom: y + scene.loadBottomOffset
    };
  }

  function rectanglesOverlap(a, b) {
    return a.left < b.x + b.w &&
           a.right > b.x &&
           a.top < b.y + b.h &&
           a.bottom > b.y;
  }

  function resize() {
    W = Math.round(window.visualViewport?.width || innerWidth);
    H = Math.round(window.visualViewport?.height || innerHeight);
    dpr = Math.min(devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    reset();
  }

  function world() {
    const portrait = H > W;
    const compactLandscape = !portrait && H < 560;

    const horizontalMargin = portrait
      ? Math.max(18, W * 0.035)
      : Math.max(52, W * 0.055);

    const left = horizontalMargin;
    const right = W - horizontalMargin;

    const railY = compactLandscape
      ? Math.max(104, H * 0.25)
      : Math.max(portrait ? 150 : 138, H * 0.20);

    const controlReserve = compactLandscape
      ? 82
      : portrait
        ? Math.max(118, H * 0.115)
        : 100;

    const groundY = H - controlReserve;
    const scaleX = (right - left) / 15;
    const scaleY = Math.max(20, (groundY - railY) / 9);

    return { left, right, railY, groundY, scaleX, scaleY };
  }

  function reset() {
    const scene = sceneGeometry();
    state.trolleyX = geometry.startX;
    state.trolleyV = 0;
    state.ropeLength = Math.max(
      physics.minRope,
      Math.min(physics.maxRope, (scene.desiredLoadY - scene.hookY) / scene.sy)
    );
    state.ropeV = 0;
    state.angle = 0;
    state.angleV = 0;
    state.startTime = performance.now();
    state.finished = false;
    state.settleTime = 0;
    messageTitleEl.textContent = 'Carga posicionada';
    messageEl.classList.remove('show');
  }

  function inputAxis() {
    return (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
  }

  function hoistAxis() {
    return (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0);
  }

  function update(dt) {
    if (state.finished) return;

    const horizontal = inputAxis();
    const vertical = hoistAxis();

    const previousV = state.trolleyV;
    state.trolleyV += horizontal * physics.horizontalAccel * dt;
    state.trolleyV *= Math.exp(-physics.trolleyDrag * dt);
    state.trolleyV = Math.max(-physics.maxTrolleySpeed, Math.min(physics.maxTrolleySpeed, state.trolleyV));
    state.trolleyX += state.trolleyV * dt;

    const minX = 0.9;
    const maxX = 14.1;
    if (state.trolleyX < minX) { state.trolleyX = minX; state.trolleyV = 0; }
    if (state.trolleyX > maxX) { state.trolleyX = maxX; state.trolleyV = 0; }

    state.ropeV = vertical * physics.hoistSpeed;
    state.ropeLength += state.ropeV * dt;
    state.ropeLength = Math.max(physics.minRope, Math.min(physics.maxRope, state.ropeLength));

    const trolleyAccel = (state.trolleyV - previousV) / Math.max(dt, 1e-4);
    const L = state.ropeLength;

    const angleAcc =
      -(physics.gravity / L) * Math.sin(state.angle)
      -(trolleyAccel / L) * Math.cos(state.angle)
      - physics.angularDamping * state.angleV;

    state.angleV += angleAcc * dt;
    state.angle += state.angleV * dt;

    const scene = sceneGeometry();
    const load = loadScreenState(scene);

    if (rectanglesOverlap(load, scene.leftWall) || rectanglesOverlap(load, scene.rightWall)) {
      fail('A carga colidiu com um dos obstáculos laterais de B.');
      return;
    }

    const positionErrorPx = Math.hypot(
      load.x - scene.targetScreenX,
      load.y - scene.desiredLoadY
    );
    const calmEnough =
      Math.abs(state.angle) < 0.045 &&
      Math.abs(state.angleV) < 0.085 &&
      Math.abs(state.trolleyV) < 0.11 &&
      Math.abs(state.ropeV) < 0.05;

    const horizontallyInside =
      load.left > scene.leftWall.x + scene.leftWall.w &&
      load.right < scene.rightWall.x;

    const verticalTolerance = Math.max(10, 15 * scene.k);
    const positionTolerance = Math.max(12, 18 * scene.k);
    const verticallyPlaced =
      Math.abs(load.y - scene.desiredLoadY) < verticalTolerance;
    const insideTarget =
      horizontallyInside &&
      verticallyPlaced &&
      positionErrorPx < positionTolerance;

    if (insideTarget && calmEnough) {
      state.settleTime += dt;
      if (state.settleTime > 0.85) finish();
    } else {
      state.settleTime = 0;
    }

    timerEl.textContent = ((performance.now() - state.startTime) / 1000).toFixed(1) + ' s';
  }

  function finish() {
    state.finished = true;
    const elapsed = ((performance.now() - state.startTime) / 1000).toFixed(1);
    messageTitleEl.textContent = 'Carga posicionada';
    resultEl.textContent = `Você concluiu o transporte em ${elapsed} segundos sem tocar nos obstáculos.`;
    messageEl.classList.add('show');
  }

  function fail(reason) {
    if (state.finished) return;
    state.finished = true;
    messageTitleEl.textContent = 'Colisão';
    resultEl.textContent = `${reason} Reinicie e tente controlar melhor o balanço da carga.`;
    messageEl.classList.add('show');
  }

  function drawRoundedRect(x, y, w, h, r, fill, stroke) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    if (fill) { ctx.fillStyle = fill; ctx.fill(); }
    if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
  }

  function render() {
    const scene = sceneGeometry();
    const g = scene.g;
    const sx = scene.sx;

    ctx.clearRect(0, 0, W, H);

    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#eef2f5');
    sky.addColorStop(1, '#dde4e9');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#d0d7dc';
    ctx.fillRect(0, g.groundY, W, H - g.groundY);

    // distant buildings
    ctx.fillStyle = 'rgba(92,106,116,.12)';
    for (let i = 0; i < 9; i++) {
      const bw = 70 + (i % 3) * 25;
      const bh = 80 + (i % 4) * 24;
      ctx.fillRect(i * (W/8) - 20, g.groundY - bh, bw, bh);
    }

    // crane mast and jib
    const mastX = g.right - sx * 0.8;
    ctx.strokeStyle = '#b47a0a';
    ctx.lineWidth = 5;
    ctx.strokeRect(mastX, g.railY - 20, 42, g.groundY - g.railY + 20);

    ctx.strokeStyle = '#c18a13';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(g.left, g.railY);
    ctx.lineTo(g.right, g.railY);
    ctx.stroke();

    ctx.lineWidth = 1.5;
    ctx.strokeStyle = 'rgba(128,86,6,.72)';
    for (let x = g.left; x < g.right; x += 34) {
      ctx.beginPath();
      ctx.moveTo(x, g.railY - 18);
      ctx.lineTo(x + 34, g.railY + 18);
      ctx.moveTo(x, g.railY + 18);
      ctx.lineTo(x + 34, g.railY - 18);
      ctx.stroke();
    }

    const toScreenX = x => g.left + x * sx;
    const trolleyScreenX = toScreenX(state.trolleyX);

    // trolley
    drawRoundedRect(trolleyScreenX - 25, g.railY - 11, 50, 22, 5, '#343b40');
    ctx.fillStyle = '#1f2529';
    ctx.beginPath();
    ctx.arc(trolleyScreenX - 15, g.railY + 13, 5, 0, Math.PI*2);
    ctx.arc(trolleyScreenX + 15, g.railY + 13, 5, 0, Math.PI*2);
    ctx.fill();

    // load geometry
    const hookX = trolleyScreenX;
    const hookY = scene.hookY;
    const currentLoad = loadScreenState(scene);
    const loadX = currentLoad.x;
    const loadY = currentLoad.y;

    const loadTop = loadY + scene.loadTopOffset;
    const slingApexY = loadTop - 27 * scene.k;
    const slingHalfWidth = scene.loadHalfWidth * 0.67;

    ctx.strokeStyle = '#3c444a';
    ctx.lineWidth = Math.max(1.5, 2.2 * scene.k);
    ctx.beginPath();
    ctx.moveTo(hookX, hookY);
    ctx.lineTo(loadX, slingApexY);
    ctx.stroke();

    ctx.lineWidth = Math.max(1.4, 2 * scene.k);
    ctx.beginPath();
    ctx.moveTo(loadX, slingApexY);
    ctx.lineTo(loadX - slingHalfWidth, loadTop + 4 * scene.k);
    ctx.moveTo(loadX, slingApexY);
    ctx.lineTo(loadX + slingHalfWidth, loadTop + 4 * scene.k);
    ctx.stroke();

    // shadow
    const shadowScale = Math.max(.35, 1 - (g.groundY - loadY)/500);
    ctx.fillStyle = 'rgba(24,30,34,.14)';
    ctx.beginPath();
    ctx.ellipse(
      loadX,
      g.groundY + 4,
      scene.loadHalfWidth * 1.12 * shadowScale,
      17 * scene.k * shadowScale,
      0, 0, Math.PI*2
    );
    ctx.fill();

    // load
    ctx.save();
    ctx.translate(loadX, loadY);
    ctx.rotate(state.angle * 0.18);
    drawRoundedRect(
      -scene.loadHalfWidth,
      scene.loadTopOffset,
      scene.loadWidth,
      scene.loadHeight,
      Math.max(3, 5 * scene.k),
      '#70787d',
      '#50585d'
    );

    ctx.fillStyle = 'rgba(255,255,255,.12)';
    ctx.fillRect(
      -scene.loadHalfWidth * 0.84,
      scene.loadTopOffset + 8 * scene.k,
      scene.loadWidth * 0.84,
      Math.max(4, 7 * scene.k)
    );

    ctx.fillStyle = 'rgba(45,50,54,.25)';
    const boltRadius = Math.max(2.5, 4 * scene.k);
    for (let q = -2; q <= 2; q++) {
      ctx.beginPath();
      ctx.arc(
        q * scene.loadHalfWidth * 0.36,
        scene.loadBottomOffset - 16 * scene.k + (Math.abs(q) % 2) * 3 * scene.k,
        boltRadius,
        0,
        Math.PI * 2
      );
      ctx.fill();
    }
    ctx.restore();

    // Exact starting point A and constrained target B.
    const startX = scene.startScreenX;
    const targetX = scene.targetScreenX;
    const zonePadding = Math.max(6, 8 * scene.k);

    ctx.save();
    ctx.setLineDash([7, 7]);
    ctx.lineWidth = Math.max(1.5, 2 * scene.k);

    ctx.strokeStyle = 'rgba(194,65,59,.82)';
    ctx.strokeRect(
      startX - scene.loadHalfWidth - zonePadding,
      scene.desiredLoadY + scene.loadTopOffset - zonePadding,
      scene.loadWidth + 2 * zonePadding,
      scene.loadHeight + 2 * zonePadding
    );
    ctx.fillStyle = 'rgba(194,65,59,.07)';
    ctx.fillRect(
      startX - scene.loadHalfWidth - zonePadding,
      scene.desiredLoadY + scene.loadTopOffset - zonePadding,
      scene.loadWidth + 2 * zonePadding,
      scene.loadHeight + 2 * zonePadding
    );

    ctx.strokeStyle = 'rgba(45,138,87,.9)';
    ctx.strokeRect(
      targetX - scene.targetHalfGap,
      scene.desiredLoadY + scene.loadTopOffset - zonePadding,
      scene.targetHalfGap * 2,
      scene.loadHeight + 2 * zonePadding
    );
    ctx.fillStyle = 'rgba(45,138,87,.08)';
    ctx.fillRect(
      targetX - scene.targetHalfGap,
      scene.desiredLoadY + scene.loadTopOffset - zonePadding,
      scene.targetHalfGap * 2,
      scene.loadHeight + 2 * zonePadding
    );
    ctx.restore();

    // Platforms.
    ctx.fillStyle = '#8f989e';
    ctx.fillRect(
      startX - scene.loadHalfWidth - 12 * scene.k,
      scene.platformY,
      scene.loadWidth + 24 * scene.k,
      scene.platformThickness
    );
    ctx.fillRect(
      targetX - scene.targetHalfGap,
      scene.platformY,
      scene.targetHalfGap * 2,
      scene.platformThickness
    );

    // Lateral collision obstacles at B.
    const wallGradient = ctx.createLinearGradient(
      0,
      scene.wallTop,
      0,
      scene.wallBottom
    );
    wallGradient.addColorStop(0, '#9a4b3d');
    wallGradient.addColorStop(1, '#71352e');
    ctx.fillStyle = wallGradient;
    ctx.fillRect(
      scene.leftWall.x,
      scene.leftWall.y,
      scene.leftWall.w,
      scene.leftWall.h
    );
    ctx.fillRect(
      scene.rightWall.x,
      scene.rightWall.y,
      scene.rightWall.w,
      scene.rightWall.h
    );

    ctx.fillStyle = 'rgba(255,255,255,.18)';
    const stripeStep = Math.max(14, 22 * scene.k);
    for (const wall of [scene.leftWall, scene.rightWall]) {
      for (
        let y = wall.y + 10 * scene.k;
        y < wall.y + wall.h;
        y += stripeStep
      ) {
        ctx.fillRect(
          wall.x + 3 * scene.k,
          y,
          wall.w - 6 * scene.k,
          Math.max(2, 4 * scene.k)
        );
      }
    }

    ctx.font = `${Math.max(12, 15 * scene.k)}px Inter, system-ui, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillStyle = '#b43f39';
    ctx.fillText(
      'A',
      startX,
      scene.desiredLoadY + scene.loadTopOffset - 14 * scene.k
    );
    ctx.fillStyle = '#28784e';
    ctx.fillText(
      'B',
      targetX,
      scene.wallTop - 10 * scene.k
    );

    // sway indicator
    const sway = Math.min(1, Math.abs(state.angle) / 0.35);
    const compactLandscape = H < 560 && W > H;
    const barW = Math.min(150, W * 0.28);
    const bx = compactLandscape ? (W - barW) / 2 : W - 24 - barW;
    const by = compactLandscape ? 88 : 128;
    ctx.fillStyle = 'rgba(255,255,255,.78)';
    drawRoundedRect(bx, by, barW, 10, 5, 'rgba(255,255,255,.78)');
    drawRoundedRect(bx, by, barW * sway, 10, 5, sway < .35 ? '#2d8a57' : sway < .7 ? '#d28b10' : '#c2413b');
    ctx.fillStyle = '#6b7785';
    ctx.textAlign = 'left';
    ctx.font = '12px Inter, system-ui, sans-serif';
    ctx.fillText('Balanço', bx, by - 7);
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min((now - last) / 1000, 0.025);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  function normalizeControlKey(key) {
    const lower = key.toLowerCase();
    const map = { a: 'ArrowLeft', d: 'ArrowRight', w: 'ArrowUp', s: 'ArrowDown' };
    return map[lower] || key;
  }

  function refreshKeyIndicators() {
    keyEls.forEach(el => el.classList.toggle('active', Boolean(keys[el.dataset.key])));
  }

  addEventListener('keydown', e => {
    const controlKey = normalizeControlKey(e.key);
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(controlKey)) {
      e.preventDefault();
      keys[controlKey] = true;
      refreshKeyIndicators();
    }
  });

  addEventListener('keyup', e => {
    const controlKey = normalizeControlKey(e.key);
    if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(controlKey)) {
      e.preventDefault();
      keys[controlKey] = false;
      refreshKeyIndicators();
    }
  });

  // Touch/mouse support
  keyEls.forEach(el => {
    const k = el.dataset.key;

    const on = e => {
      e.preventDefault();
      try { el.setPointerCapture(e.pointerId); } catch (_) {}
      keys[k] = true;
      el.classList.add('active');
    };

    const off = e => {
      e.preventDefault();
      keys[k] = false;
      el.classList.remove('active');
      try { el.releasePointerCapture(e.pointerId); } catch (_) {}
    };

    el.addEventListener('pointerdown', on, { passive: false });
    el.addEventListener('pointerup', off, { passive: false });
    el.addEventListener('pointercancel', off, { passive: false });
    el.addEventListener('lostpointercapture', off, { passive: false });
  });

  document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });

  addEventListener('blur', () => {
    Object.keys(keys).forEach(k => keys[k] = false);
    keyEls.forEach(el => el.classList.remove('active'));
  });

  restartBtn.addEventListener('click', reset);
  addEventListener('resize', resize);
  window.visualViewport?.addEventListener('resize', resize);
  window.visualViewport?.addEventListener('scroll', resize);

  resize();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
